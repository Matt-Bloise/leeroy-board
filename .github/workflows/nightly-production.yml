name: Nightly Production Checks

# Moved out of the per-PR run to save GitHub minutes (docs/runbooks/ci-minutes.md):
#   degraded    tests/browser/degraded-modes.mjs, all 144 checks, Chromium, against https://leeroy.party/ (the timing-sensitive suite)
#   zap         OWASP ZAP baseline (passive), against https://leeroy.party/ (the job summary prints how many URLs it crawled and how many are Worker /api/ paths)
#   lighthouse  Lighthouse (mobile 390x844, 3 runs per URL, budgets in lighthouserc.json) against https://leeroy.party/ and /landing/. INFORMATIONAL: continue-on-error,
#               never in the notify job's needs, never fails the night. It used to run on every `ci-full` PR run (lighthouse.yml, removed); the job summary prints the
#               Worker /api/ requests its page loads made (counted from Lighthouse's own request list). Run it by hand with "Run workflow" (workflow_dispatch).
#   notify      after two consecutive failed runs, opens ONE issue labelled `nightly` (or comments on the open one). Never closes it.
# Report only: nothing here blocks a merge or a deploy.
#
# Scheduled workflows run only on the default branch (master) and GitHub disables them after 60 days without repository activity.
# If the nightly stops appearing in the Actions tab, re-enable it there or run it once with "Run workflow" (workflow_dispatch).
# This file does nothing before it is merged to master.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET: https://leeroy.party/

jobs:
  degraded:
    name: degraded-modes (full, production)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Degraded modes, every condition
        working-directory: tests
        run: |
          set -o pipefail
          # The delays and failures are Playwright route interception in the browser; nothing is changed on the server. No AI call, nothing is sent.
          node browser/degraded-modes.mjs --url "$TARGET" 2>&1 | tee "$RUNNER_TEMP/degraded.log"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: nightly-degraded-log
          path: ${{ runner.temp }}/degraded.log
          if-no-files-found: ignore
          retention-days: 14

  zap:
    name: OWASP ZAP baseline (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: ZAP baseline scan
        id: zap
        continue-on-error: true
        run: |
          mkdir -p zap-out out && chmod 777 zap-out
          # -I: warnings and failures do not set the exit code. Passive scan only (baseline does not attack).
          docker run --rm -v "$PWD/zap-out:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.0 \
            zap-baseline.py -t "$TARGET" -J zap.json -r zap.html -I -m 5 2>&1 | tee zap-out/zap.log
          exit "${PIPESTATUS[0]}"

      - name: Summarise
        id: summary
        if: always()
        env:
          ZAP: ${{ steps.zap.outcome }}
        run: |
          mkdir -p out
          if [ "$ZAP" = "success" ] && [ -s zap-out/zap.json ]; then
            jq '{status:"ok",
                 high:([.site[].alerts[]|select(.riskcode=="3")]|length),
                 medium:([.site[].alerts[]|select(.riskcode=="2")]|length),
                 low:([.site[].alerts[]|select(.riskcode=="1")]|length),
                 info:([.site[].alerts[]|select(.riskcode=="0")]|length),
                 top:([.site[].alerts[]|select(.riskcode!="0")|"\(.riskdesc|split(" ")[0]) \(.name)"]|.[0:10])}' zap-out/zap.json > out/zap-summary.json || echo '{"status":"failed"}' > out/zap-summary.json
          else
            echo '{"status":"failed"}' > out/zap-summary.json
          fi
          cat out/zap-summary.json
          {
            echo "### ZAP baseline against $TARGET"
            echo '```json'
            cat out/zap-summary.json
            echo '```'
            # Request count (measured, not a limit): ZAP prints "Total of N URLs" for its crawl; the instances it reports under /api/ are the ones the Worker served.
            echo "ZAP crawl: $(grep -o 'Total of [0-9]* URLs' zap-out/zap.log 2>/dev/null | tail -1 || true)"
            echo "ZAP alert instances on Worker paths (/api/): $(jq '[.site[].alerts[].instances[]?.uri | select(test("^https?://[^/]+/api/"))] | length' zap-out/zap.json 2>/dev/null || echo n/a)"
          } >> "$GITHUB_STEP_SUMMARY"
          # A high-risk alert fails the nightly (so the two-in-a-row rule can open an issue). Medium and below, and a scan that did not run, are reported only.
          HIGH=$(jq -r '.high // 0' out/zap-summary.json)
          if [ "$HIGH" != "0" ]; then echo "::error::ZAP reported $HIGH high-risk alert(s)."; exit 1; fi

      - name: Upload artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: nightly-zap
          path: |
            zap-out/zap.json
            zap-out/zap.html
            zap-out/zap.log
            out/zap-summary.json
          if-no-files-found: ignore
          retention-days: 30

  lighthouse:
    name: Lighthouse (production, informational)
    # Informational only. Never fails the night: the job has continue-on-error, every assertion in lighthouserc.json is level "warn", the lhci step ends in "exit 0",
    # and the notify job does not wait for it. Runbook: docs/runbooks/lighthouse.md
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Lighthouse (mobile 390x844, 3 runs per URL)
        id: lhci
        continue-on-error: true
        run: |
          set +e
          # Production pages in a real browser: their /api/ calls reach the production Worker (counted in the summary below, about 3 x 2 page loads a night).
          npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json \
            --collect.url="$TARGET" --collect.url="${TARGET}landing/" 2>&1 | tee "$RUNNER_TEMP/lighthouse.log"
          echo "lhci finished (exit status ignored on purpose)"
          exit 0

      - name: Summary (budgets and Worker requests)
        if: always() && !cancelled()
        continue-on-error: true
        run: node tools/lighthouse-summary.mjs --target "$TARGET" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: nightly-lighthouse
          path: |
            .lighthouseci
            ${{ runner.temp }}/lighthouse.log
          if-no-files-found: ignore
          retention-days: 14

  notify:
    name: issue after two failures in a row
    needs: [degraded, zap]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open or update the nightly issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          DEGRADED: ${{ needs.degraded.result }}
          ZAP: ${{ needs.zap.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const failed = process.env.DEGRADED !== "success" || process.env.ZAP !== "success";
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            core.summary.addRaw(`degraded-modes: ${process.env.DEGRADED}, ZAP: ${process.env.ZAP}`).write();
            if (!failed) { console.log("Both suites passed: nothing to do."); return; }
            // State without writes: the previous finished run of this workflow is the memory. This run ends red (last step), so it counts for the next night.
            const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: "nightly-production.yml", status: "completed", per_page: 10 });
            const previous = data.workflow_runs.find((r) => r.id !== context.runId && (r.conclusion === "success" || r.conclusion === "failure"));
            const twoInARow = Boolean(previous) && previous.conclusion === "failure";
            console.log(`Previous finished run: ${previous ? `${previous.id} ${previous.conclusion}` : "none"}; two in a row: ${twoInARow}`);
            if (twoInARow) {
              const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: "nightly", per_page: 100 });
              const issue = open.find((i) => !i.pull_request);
              const lines = [
                `Nightly production checks failed again (${new Date().toISOString().slice(0, 10)}).`,
                "",
                `- degraded-modes (full, ${process.env.TARGET || "https://leeroy.party/"}): ${process.env.DEGRADED}`,
                `- OWASP ZAP baseline: ${process.env.ZAP}`,
                `- Run: ${run}`,
                `- Previous failed run: ${previous.html_url}`,
              ].join("\n");
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: lines });
                console.log(`Commented on open issue #${issue.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo, labels: ["nightly"],
                  title: "Nightly production checks failed twice in a row",
                  body: [lines, "", "This issue is opened after two consecutive failures and is never closed automatically. Close it yourself once the nightly is green again. Runbook: docs/runbooks/ci-minutes.md (section Nightly)."].join("\n"),
                });
                console.log(`Opened issue #${created.data.number}`);
              }
            } else {
              console.log("First failure: no issue yet (the next failed night opens one).");
            }

      - name: End red when a suite failed
        if: needs.degraded.result != 'success' || needs.zap.result != 'success'
        run: |
          echo "::error::Nightly failed (degraded=${{ needs.degraded.result }}, zap=${{ needs.zap.result }})."
          exit 1
