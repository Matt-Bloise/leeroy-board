name: Production smoke (manual, no deploy)

# Runs the browser smoke against production for the commit you pick, WITHOUT deploying anything: workflow_dispatch only, no Cloudflare secret, no environment, GITHUB_TOKEN read-only.
# Use it when production has had no browser smoke (the post-deploy smoke in deploy-cloudflare.yml failed or never ran), after a rollback, or to look again without spending a deploy.
# Start it on master (default branch) so the commit checked out is the one that was deployed. It then proves WHICH commit it tested: tools/served-stamps.mjs compares the ?v= stamps of the page leeroy.party serves
# with index.html of the checked-out commit and fails (exit 1 or 2) when they differ or cannot be read, and tools/production-smoke.sh fails unless the Chromium and the WebKit first-screen checks passed.
# Cost: about 15 Worker requests for the smoke plus 1 to 6 for the stamp check (docs/runbooks/cloudflare-requests.md). It deploys nothing, so it spends no deploying merge and no preview spin-up.
# This file is in deploy-cloudflare.yml's paths-ignore: editing it does not deploy production. The shared pieces (tools/production-smoke.sh, tools/served-stamps.mjs, the image pin) are not ignored.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Production smoke (browsers, no deploy)
    runs-on: ubuntu-24.04
    # Same image pin as the post-deploy-smoke job (tests/unit/production-smoke-job.test.mjs keeps the two and tests/package.json equal). No apt runs in this job.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble@sha256:70e367e0cbf60340a5b5fd562f6247a34eb3196efab9f88a3dd56482d9fe09d2
      options: --ipc=host --init
    timeout-minutes: 15
    # Its own group: sharing production-probe with the post-deploy smoke could cancel a pending smoke (one running and one pending job per group).
    concurrency:
      group: production-smoke-manual
      cancel-in-progress: false
    env:
      SMOKE_REQUIRE_ENGINES: "1"
      PREVIEW_API: https://api.leeroy.party
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the test dependencies (npm only)
        working-directory: tests
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Show which commit production serves
        timeout-minutes: 4
        shell: bash   # bash -eo pipefail: a failing served-stamps.mjs must not be hidden by tee
        run: |
          echo "Checked-out commit: $GITHUB_SHA ($GITHUB_REF)"
          node tools/served-stamps.mjs --url https://leeroy.party/ | tee "$RUNNER_TEMP/served-stamps.log"
          { echo "## Which commit was tested"; echo; echo "Checked out: \`$GITHUB_SHA\`"; echo; echo '```'; tail -n 12 "$RUNNER_TEMP/served-stamps.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy smoke (about 15 Worker requests)
        timeout-minutes: 8
        run: bash tools/production-smoke.sh https://leeroy.party/

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: production-smoke-log
          path: |
            ${{ runner.temp }}/deploy-smoke.log
            ${{ runner.temp }}/served-stamps.log
          if-no-files-found: ignore
          retention-days: 14
