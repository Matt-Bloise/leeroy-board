name: Deploy Site & Serverless Backend to Cloudflare (Production)

on:
  push:
    branches:
      - master

concurrency:
  group: cloudflare-production-master
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Worker, D1 & Static Site to Cloudflare Production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: leeroy-board-db
      PAGES_PROJECT_NAME: leeroy-board

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler CLI
        working-directory: infrastructure
        run: npm install --no-audit --no-fund

      - name: Ensure D1 Database Exists & Patch wrangler.toml
        working-directory: infrastructure
        run: |
          set -e
          echo "Checking for existing D1 database '$D1_DATABASE_NAME'..."
          LIST_JSON=$(npx wrangler d1 list --json)
          DB_ID=$(node -e '
            const list = JSON.parse(process.argv[1] || "[]");
            const found = list.find(d => d.name === process.env.D1_DATABASE_NAME);
            if (found) process.stdout.write(found.uuid);
          ' "$LIST_JSON")

          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database '$D1_DATABASE_NAME'..."
            CREATE_OUT=$(npx wrangler d1 create "$D1_DATABASE_NAME")
            echo "$CREATE_OUT"
            DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' | head -n 1)
          fi

          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not resolve D1 database_id"
            exit 1
          fi

          echo "Resolved D1 database_id: $DB_ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/g" wrangler.toml

      - name: Apply D1 Schema & Numbered Migrations (`schema.sql` + `migrations/*.sql`)
        working-directory: infrastructure
        run: |
          set -e
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=./schema.sql
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Seed Initial Board & Library Data into D1 (if empty)
        working-directory: infrastructure
        run: |
          set -e
          COUNT_JSON=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command="SELECT COUNT(*) AS n FROM kv_state;" --json)
          ROW_COUNT=$(node -e '
            const res = JSON.parse(process.argv[1] || "[]");
            const n = res?.[0]?.results?.[0]?.n ?? 0;
            process.stdout.write(String(n));
          ' "$COUNT_JSON")

          echo "Current kv_state row count in D1: $ROW_COUNT"
          if [ "$ROW_COUNT" = "0" ]; then
            echo "Seeding D1 from repository data/*.json and data/library/*.json..."
            node ./scripts/seed-d1.mjs --remote
          else
            echo "D1 already contains live state ($ROW_COUNT rows). Skipping seed to preserve live edits."
          fi

      - name: Deploy Cloudflare Worker + Durable Object + Cron Trigger
        id: worker
        working-directory: infrastructure
        run: |
          set -e
          DEPLOY_OUT=$(npx wrangler deploy 2>&1)
          echo "$DEPLOY_OUT"
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oE "https://api\.leeroy\.party" | head -n 1)
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oE "https://leeroy-brain\.[a-z0-9-]+\.workers\.dev" | head -n 1)
          fi
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="https://api.leeroy.party"
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Sync Worker Secrets (AI Providers, Admin Token, Discord)
        working-directory: infrastructure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BOARD_ADMIN_TOKEN: ${{ secrets.BOARD_ADMIN_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          for SECRET_NAME in ANTHROPIC_API_KEY GEMINI_API_KEY GROQ_API_KEY CEREBRAS_API_KEY GITHUB_MODELS_TOKEN OPENROUTER_API_KEY BOARD_ADMIN_TOKEN DISCORD_WEBHOOK_URL DISCORD_PUBLIC_KEY DISCORD_CLIENT_SECRET; do
            SECRET_VAL="${!SECRET_NAME}"
            if [ -n "$SECRET_VAL" ]; then
              printf "%s" "$SECRET_VAL" | npx wrangler secret put "$SECRET_NAME"
            fi
          done

      - name: Stage Static Site Bundle & Deploy to Cloudflare Pages Production
        run: |
          set -e
          mkdir -p .cloudflare-dist
          for item in index.html og-1200x630.jpg robots.txt atlas cloth css data fonts img js next room scenes vendor; do
            if [ -e "$item" ]; then
              cp -R "$item" .cloudflare-dist/
            fi
          done

          # Stamp the resolved production Worker URL into .cloudflare-dist/js/brain.js
          node -e '
            const fs = require("fs");
            const p = ".cloudflare-dist/js/brain.js";
            const s = fs.readFileSync(p, "utf8");
            fs.writeFileSync(p, s.replace(/const WORKER = "[^"]+";/, `const WORKER = "${process.argv[1]}";`), "utf8");
          ' "${{ steps.worker.outputs.worker_url }}"

          cd infrastructure
          npx wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch=master >/dev/null 2>&1 || true
          npx wrangler pages deploy ../.cloudflare-dist --project-name="$PAGES_PROJECT_NAME" --branch=master --commit-dirty=true
