name: Deploy Site & Serverless Backend to Cloudflare (Production)

on:
  push:
    branches:
      - master
    paths-ignore:
      # Skipped only when EVERY changed file matches (GitHub evaluates this per push). Nothing here is read by this workflow, by tools/pages-bundle.mjs or by wrangler. The production probe job reads tests/browser/prod-probe.mjs, tests/helpers/ and tests/package*.json, so those are NOT ignored (tests/browser/, tests/helpers/, tests/package.json, tests/package-lock.json).
      # A skipped push changes nothing: the next push that deploys checks out its own sha, which contains every earlier commit. docs/runbooks/rollback.md, "When a push deploys".
      # Never add: infrastructure/, data/, pages-worker/, js/, css/, scenes/, index.html, tools/pages-bundle.mjs, tools/d1-row-count.mjs, tools/flagship-ensure-flags.mjs, tools/sync-discord-commands.mjs.
      - "docs/**"
      - "tests/unit/**"
      - "tests/api/**"
      - "tests/contract/**"
      - "tests/csp/**"
      - "tests/fixtures/**"
      - "tests/load/**"
      - "tests/local/**"
      - "tests/visual/**"
      - "tests/*.png"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/production-smoke.yml"
      - ".claude/**"
      - "tools/gateway-spike/**"
      - "tools/replay/**"
      - "tools/voice-eval/**"
      - "tools/add-member.mjs"
      - "tools/api-scope.mjs"
      - "tools/bench-ask-cpu.mjs"
      - "tools/check-secret-scope.sh"
      - "tools/ci-report.mjs"
      - "tools/ci-scope.mjs"
      - "tools/claude-selftest.mjs"
      - "tools/cost-model.mjs"
      - "tools/deadman-status.mjs"
      - "tools/docs-only.mjs"
      - "tools/first-paint-measure.mjs"
      - "tools/flake-signatures.json"
      - "tools/flake-signatures.mjs"
      - "tools/grade-answers.mjs"
      - "tools/heartbeat-send.mjs"
      - "tools/images.mjs"
      - "tools/import-signups.mjs"
      - "tools/lighthouse-summary.mjs"
      - "tools/local-check.sh"
      - "tools/measure-claude-latency.mjs"
      - "tools/measure-research-cpu.mjs"
      - "tools/pages-prune.mjs"
      - "tools/pull-export.mjs"
      - "tools/render-legal.mjs"
      - "tools/research-synthetic.mjs"
      - "tools/restore-drill.mjs"
      - "tools/restore-local.mjs"
      - "tools/roster-upsert.mjs"
      - "tools/rotate-salts.mjs"
      - "tools/shadow-ask.mjs"
      - "tools/source-probe.mjs"
      - "tools/source-probe.sources.json"
      - "tools/stamps.mjs"
      - "tools/terms-watch.mjs"
      - "tools/tooltips-compliance.mjs"
  # No schedule here: every run of this workflow is a real deploy attempt (a refusal fails red), so a successful run always means production was deployed. The nightly catch-up of a refused deploy is its own
  # workflow, deploy-catchup.yml, which starts this one through workflow_dispatch only when the "Production is behind master" notice is open.
  workflow_dispatch:
    inputs:
      budget_override:
        description: "Only the session that merges, with the account owner's agreement: start this deploy although today's budget of production deploys (.github/cf-budget.json) is used up. Never needed for a normal deploy."
        type: boolean
        default: false
      allow_create_database:
        description: "Manual first-time setup only: allow creating an EMPTY D1 database when none named leeroy-board-db exists. Never needed for a normal deploy. See docs/runbooks/rollback.md, Deploy safety."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production-master
  cancel-in-progress: false

jobs:
  # Counts today's production deploys through the GitHub API (read-only) and refuses to start another when the daily budget (.github/cf-budget.json, deployingMergesPerDay) is used up. Fails closed: when the
  # count cannot be made, nothing deploys. The only way past: the label named in that file on a pull request merged into this commit, or the budget_override input of a manual run. A refused deploy leaves
  # master undeployed until the next UTC day or the override; the next push that deploys contains every earlier commit.
  budget-gate:
    name: Cloudflare daily budget pre-flight (deploy)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issues: write is only for the sticky "Production is behind master" notice (the step below); this job holds no Cloudflare secret.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Count today's deploys and refuse when the budget is used up
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BUDGET_OVERRIDE: ${{ inputs.budget_override }}
        run: node tools/cf-budget-check.mjs deploy

      # A refusal (budget used up, or the count could not be made) leaves master ahead of production. Say so where someone will see it: one sticky issue, updated by each refusal and closed by the next deploy
      # (job clear-behind-notice). The nightly catch-up workflow (deploy-catchup.yml, 00:25 UTC) delivers it, because a deploy builds the commit it is started on and so contains every earlier commit.
      - name: Say that production is behind master
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- production-behind-master -->";
            const { owner, repo } = context.repo;
            const sha = context.sha.slice(0, 7);
            const runUrl = context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId;
            const body = [marker, "### Production is behind master", "",
              "The deploy of master " + sha + " did **not** run: the daily Cloudflare budget pre-flight refused it, or could not count today's deploys (" + runUrl + "). The merge is on master; production still runs an older commit.", "",
              "- **What delivers it:** the nightly catch-up workflow (deploy-catchup.yml) at 00:25 UTC, which starts this workflow by hand (the first deploy of the next UTC day), or the next merge that deploys: a deploy builds the commit it is started on, so it carries every earlier commit. This issue closes itself when a deploy succeeds.",
              "- **Sooner:** only the session that merges, with the account owner's agreement, runs the deploy workflow by hand with the budget_override input, or adds the label from .github/cf-budget.json to a pull request merged into master.",
              "- **Why:** the Cloudflare account is a friend's, on the free plan; see docs/runbooks/cloudflare-requests.md, Daily budgets.", "",
              "_Last refusal: " + new Date().toISOString() + " (master " + sha + ")._"].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            const existing = issues.find((i) => !i.pull_request && i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: "Another deploy was refused: master " + sha + " (" + runUrl + ")." });
            } else {
              await github.rest.issues.create({ owner, repo, title: "Production is behind master: a deploy was refused by the daily budget", body });
            }
            core.summary.addHeading("Production is behind master").addRaw("The deploy was refused; see the issue. The next deploy, or the nightly catch-up workflow at 00:25 UTC, delivers it.").write();

  deploy-production:
    name: Deploy Worker, D1 & Static Site to Cloudflare Production
    needs: budget-gate
    runs-on: ubuntu-latest
    # A manual run may be started from any branch; production only ever deploys from master.
    if: github.ref == 'refs/heads/master'
    # Most production secrets live in the GitHub environment `production` (deployment branches: master only); delete their repository-level copies once moved (docs/runbooks/ci-secrets.md).
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are repository secrets by design (previews read them): keep those copies. An environment copy, if one exists, wins for this deploy.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: leeroy-board-db
      PAGES_PROJECT_NAME: leeroy-board

    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require the production environment secrets
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.BOARD_ADMIN_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Fail before anything is changed. There is no fallback: if the environment `production` does not hold these, stop.
          MISSING=""
          [ -n "$DEPLOY_TOKEN" ] || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "$ADMIN_TOKEN" ] || MISSING="$MISSING BOARD_ADMIN_TOKEN"
          [ -n "$ACCOUNT_ID" ] || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Production secrets missing:$MISSING. Nothing was deployed. BOARD_ADMIN_TOKEN must be an environment secret (Settings > Environments > production > Environment secrets). CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are read at repository level (Settings > Secrets and variables > Actions > Repository secrets; the environment inherits them, and previews need the token there). See docs/runbooks/ci-secrets.md."
            exit 1
          fi

      - name: Require salt secrets before deploying
        env:
          USER_SALT: ${{ secrets.USER_SALT }}
          KEY_SALT: ${{ secrets.KEY_SALT }}
        run: |
          # USER_SALT and KEY_SALT are Worker secrets, no longer wrangler.toml vars. Without them the Worker
          # refuses guest asks, votes, Discord login and member keys, so stop before replacing the live Worker.
          for N in USER_SALT KEY_SALT; do
            if [ -z "${!N}" ]; then
              echo "::error::Repository secret $N is missing. The owner must create it (same value as before, so existing hashes stay valid). See docs/runbooks/secrets.md."
              exit 1
            fi
          done

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install Wrangler CLI
        working-directory: infrastructure
        run: |
          # Exact, locked install: package.json pins wrangler without a range and the lockfile fixes the whole tree. npm ci fails if they disagree.
          npm ci --no-audit --no-fund
          WANT=$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")
          HAVE=$(node -p "require('./node_modules/wrangler/package.json').version")
          echo "wrangler locked $WANT, installed $HAVE"
          [ -n "$WANT" ] && [ "$WANT" = "$HAVE" ] || { echo "::error::Installed wrangler ($HAVE) does not match the lockfile ($WANT)."; exit 1; }

      - name: Verify Cloudflare Credentials & Scope Diagnostics
        working-directory: infrastructure
        run: |
          set -e
          echo "=== Cloudflare Credential & Account Pre-flight Check ==="

          # Sanitize whitespace / carriage returns / quotes
          CLEAN_TOKEN=$(echo "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ' | sed -e 's/^["\x27]//' -e 's/["\x27]$//')
          CLEAN_ACC=$(echo "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n ' | sed -e 's/^["\x27]//' -e 's/["\x27]$//')

          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or missing. It is a repository secret (Settings > Secrets and variables > Actions > Repository secrets), not an environment secret; BOARD_ADMIN_TOKEN is the environment secret (Settings > Environments > production). See docs/runbooks/ci-secrets.md."
            exit 1
          fi

          # 1. Verify token status against Cloudflare verify endpoint
          VERIFY_RES=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          TOKEN_STATUS=$(node -e 'try { const j = JSON.parse(process.argv[1]); console.log(j.result?.status || (j.success ? "active" : "failed")); } catch(e) { console.log("failed"); }' "$VERIFY_RES")

          if [ "$TOKEN_STATUS" != "active" ]; then
            echo "::error::Cloudflare API Token validation failed. Status: $TOKEN_STATUS"
            echo "Cloudflare error codes: $(printf '%s' "$VERIFY_RES" | node ../tools/cf-error-codes.mjs)"
            echo ""
            echo "Action Required:"
            echo "1. Verify CLOUDFLARE_API_TOKEN is a valid API Token (not a Global API Key)."
            echo "2. Check that the token is Active in Cloudflare Dashboard -> My Profile -> API Tokens."
            exit 1
          fi
          echo "✓ Cloudflare API Token is ACTIVE and verified."

          # 2. Check accounts the token has access to
          ACCOUNTS_RES=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          ACC_INFO=$(node -e '
            try {
              const j = JSON.parse(process.argv[1]);
              const accs = j.result || [];
              const target = process.env.TARGET_ID;
              const match = accs.find(a => a.id === target);
              if (match) {
                console.log("MATCH:" + match.id);
              } else if (accs.length === 1) {
                console.log("RESOLVED_SINGLE:" + accs[0].id);
              } else if (accs.length > 1) {
                console.log("MULTIPLE:" + accs.length);
              } else {
                console.log("NONE");
              }
            } catch(e) {
              console.log("PARSE_ERROR");
            }
          ' "$ACCOUNTS_RES")

          TARGET_ACCOUNT_ID="$CLEAN_ACC"
          if [[ "$ACC_INFO" == MATCH:* ]]; then
            ACC_ID=$(echo "$ACC_INFO" | cut -d: -f2)
            echo "::add-mask::$ACC_ID"
            echo "✓ Account ID matches the token (account name and id are not printed)."
          elif [[ "$ACC_INFO" == RESOLVED_SINGLE:* ]]; then
            ACC_ID=$(echo "$ACC_INFO" | cut -d: -f2)
            echo "::add-mask::$ACC_ID"
            echo "::notice::Auto-resolved the Cloudflare account from the token (account name and id are not printed)."
            TARGET_ACCOUNT_ID="$ACC_ID"
          elif [[ "$ACC_INFO" == MULTIPLE:* ]]; then
            echo "::error::Provided Account ID '$CLEAN_ACC' does not match any accounts this token can access."
            echo "The token can access more than one account; names and ids are not printed. Set CLOUDFLARE_ACCOUNT_ID to the intended one."
            exit 1
          else
            echo "::warning::Could not query /accounts via token. Proceeding with provided Account ID: $CLEAN_ACC"
          fi

          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$TARGET_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "TARGET_ACCOUNT_ID=$TARGET_ACCOUNT_ID" >> "$GITHUB_ENV"

          # 3. Test D1 permissions specifically
          D1_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$TARGET_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          D1_SUCCESS=$(node -e 'try { const j = JSON.parse(process.argv[1]); console.log(j.success ? "true" : "false"); } catch(e) { console.log("false"); }' "$D1_CHECK")

          if [ "$D1_SUCCESS" != "true" ]; then
            echo "::error::Token lacks D1 permissions for account '$TARGET_ACCOUNT_ID'."
            echo "Cloudflare error codes: $(printf '%s' "$D1_CHECK" | node ../tools/cf-error-codes.mjs)"
            echo ""
            echo "Action Required to Fix (Authentication error 10000 on D1):"
            echo "In Cloudflare Dashboard -> My Profile (top-right avatar) -> API Tokens:"
            echo "1. Edit the token used for CLOUDFLARE_API_TOKEN."
            echo "2. Under 'Permissions', click '+ Add more' and add: 'Account' -> 'D1' -> 'Edit'."
            echo "3. Also ensure 'Account' -> 'Cloudflare Pages' -> 'Edit' is present."
            echo "4. Save token and re-run workflow."
            exit 1
          fi
          echo "✓ Cloudflare D1 permissions verified."

          # 4. Test Zone permissions for leeroy.party (required for custom domain api.leeroy.party)
          ZONE_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=leeroy.party" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          ZONE_SUCCESS=$(node -e '
            try {
              const j = JSON.parse(process.argv[1]);
              console.log(j.success ? "true" : "false");
            } catch(e) {
              console.log("false");
            }
          ' "$ZONE_CHECK")
          ZONE_COUNT=$(node -e '
            try {
              const j = JSON.parse(process.argv[1]);
              console.log(j.result ? j.result.length : 0);
            } catch(e) {
              console.log("0");
            }
          ' "$ZONE_CHECK")

          if [ "$ZONE_SUCCESS" != "true" ]; then
            echo "::error::Token lacks Zone Read permissions for leeroy.party."
            echo "Cloudflare error codes: $(printf '%s' "$ZONE_CHECK" | node ../tools/cf-error-codes.mjs)"
            echo ""
            echo "Action Required to Fix:"
            echo "In Cloudflare Dashboard -> My Profile -> API Tokens:"
            echo "1. Edit the token used for CLOUDFLARE_API_TOKEN (e.g. 'Leeroy Dungeons and Drinking Key')."
            echo "2. Under 'Permissions', click '+ Add more' and add: 'Zone' -> 'Zone' -> 'Read'."
            echo "3. Under 'Zone Resources', ensure 'Include' -> 'Specific zone' includes 'leeroy.party' (or 'All zones')."
            echo "4. Save token and re-run workflow."
            exit 1
          fi

          if [ "$ZONE_COUNT" = "0" ]; then
            echo "::warning::Zone 'leeroy.party' was not found in Cloudflare account '$TARGET_ACCOUNT_ID'."
          else
            echo "✓ Cloudflare Zone permissions verified for leeroy.party."
          fi

      - name: Ensure D1 Database Exists & Patch wrangler.toml
        working-directory: infrastructure
        env:
          ALLOW_CREATE_DB: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_create_database && 'true' || 'false' }}
        run: |
          set -e
          echo "Checking for existing D1 database '$D1_DATABASE_NAME'..."
          # A failed lookup is never treated as "database not found": that would risk an empty production database.
          if ! LIST_JSON=$(npx wrangler d1 list --json); then
            echo "::error::'wrangler d1 list --json' failed, so the existing D1 database '$D1_DATABASE_NAME' could not be looked up. Nothing was created or changed. Check the token's D1 permission and Cloudflare status, then re-run. See docs/runbooks/rollback.md (Deploy safety)."
            exit 1
          fi
          if ! DB_ID=$(node -e '
            const list = JSON.parse(process.argv[1]);
            if (!Array.isArray(list)) throw new Error("not a list");
            const found = list.find(d => d.name === process.env.D1_DATABASE_NAME);
            if (found) process.stdout.write(found.uuid);
          ' "$LIST_JSON"); then
            echo "::error::Could not read the D1 database list from wrangler (unexpected output). Nothing was created or changed. See docs/runbooks/rollback.md (Deploy safety)."
            exit 1
          fi

          if [ -z "$DB_ID" ]; then
            # Creating a database is a manual first-time action only. On push to master it never happens.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_CREATE_DB" = "true" ]; then
              echo "::warning::Creating a NEW EMPTY D1 database '$D1_DATABASE_NAME' (manual run with allow_create_database=true). It will be seeded from the repository JSON."
              CREATE_OUT=$(npx wrangler d1 create "$D1_DATABASE_NAME")
              echo "$CREATE_OUT"
              DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' | head -n 1)
            else
              echo "::error::D1 database '$D1_DATABASE_NAME' was not found in this Cloudflare account. Refusing to create an empty one: production would run on an empty database. Check CLOUDFLARE_ACCOUNT_ID and the account that owns the Worker. If this really is a first-time setup, run this workflow manually (workflow_dispatch) with allow_create_database=true. See docs/runbooks/rollback.md (Deploy safety)."
              exit 1
            fi
          fi

          if [ -z "$DB_ID" ]; then
            echo "::error::Could not resolve D1 database_id"
            exit 1
          fi

          echo "Resolved D1 database_id: $DB_ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/g" wrangler.toml

          # Inject CLOUDFLARE_ACCOUNT_ID into wrangler.toml [vars] for AI Gateway routing
          TARGET_ACC="${CLOUDFLARE_ACCOUNT_ID:-$TARGET_ACCOUNT_ID}"
          if [ -n "$TARGET_ACC" ]; then
            echo "Patching CLOUDFLARE_ACCOUNT_ID in wrangler.toml with $TARGET_ACC..."
            sed -i "s/CLOUDFLARE_ACCOUNT_ID = \"\"/CLOUDFLARE_ACCOUNT_ID = \"$TARGET_ACC\"/g" wrangler.toml
            grep "CLOUDFLARE_ACCOUNT_ID" wrangler.toml
            if grep -q 'CLOUDFLARE_ACCOUNT_ID = ""' wrangler.toml; then
              echo "::error::Failed to patch CLOUDFLARE_ACCOUNT_ID in wrangler.toml!"
              exit 1
            fi
          else
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or empty in deploy step!"
            exit 1
          fi

      - name: Record D1 Time Travel bookmark before migrations
        # Read-only (wrangler d1 time-travel info changes nothing). Never blocks a deploy: continue-on-error, and the summary is written even if the call fails.
        # Prints the bookmark only; the output of this command carries no token or account secret.
        continue-on-error: true
        working-directory: infrastructure
        run: |
          set +e
          OUT="$(npx wrangler d1 time-travel info "$D1_DATABASE_NAME" 2>&1)"
          CODE=$?
          {
            echo "### D1 Time Travel bookmark before migrations"
            echo ""
            echo '```'
            echo "$OUT"
            echo '```'
            if [ "$CODE" -ne 0 ]; then echo ""; echo "Bookmark lookup failed (exit $CODE); the deploy continues."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"

      - name: Apply Unified D1 Schema (`schema.sql`) & Pending Migrations
        working-directory: infrastructure
        run: |
          set -e
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=./schema.sql
          if [ -d "migrations" ] && [ -n "$(find migrations -maxdepth 1 -name '*.sql' 2>/dev/null)" ]; then
            echo "Applying numbered migrations..."
            npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote
          else
            echo "Initial database deployment: unified schema.sql applied with zero migrations."
          fi

      - name: Seed Initial Board & Library Data into D1 (if empty)
        working-directory: infrastructure
        run: |
          set -e
          COUNT_JSON=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command="SELECT COUNT(*) AS n FROM kv_state;" --json)
          # Fail closed: an unexpected output shape must stop the deploy, never read as 0 rows (that would seed over live kv_state).
          ROW_COUNT=$(node ../tools/d1-row-count.mjs "$COUNT_JSON") || { echo "::error::Could not read the kv_state row count from wrangler. Nothing was seeded."; exit 1; }

          echo "Current kv_state row count in D1: $ROW_COUNT"
          if [ "$ROW_COUNT" = "0" ]; then
            echo "Seeding D1 from repository data/*.json and data/library/*.json..."
            node ./scripts/seed-d1.mjs --remote
          else
            echo "D1 already contains live state ($ROW_COUNT rows). Skipping seed to preserve live edits."
          fi

      # Library-only seed: touches lib_blobs + lib_pages only (never kv_state). Per page the repo copy wins only when newer than the D1 row,
      # and the whole step is a no-op while the sha256 of data/library/*.json equals the lib_blobs row `seed.stamp`. This job runs on master in the production environment only.
      # continue-on-error: this step can never block or fail a production deploy; the Worker deploy does not depend on it.
      - name: Merge Library data into D1 (only when data/library changed)
        continue-on-error: true
        working-directory: infrastructure
        run: |
          if ! node ./scripts/seed-d1.mjs --library-only --remote; then
            echo "::warning::Library seed failed or aborted (nothing blocks the deploy). The Library in D1 is unchanged or partly merged; re-run the deploy after fixing it. See the log above."
            exit 1
          fi

      - name: Deploy Cloudflare Worker + Durable Object + Cron Trigger
        id: worker
        working-directory: infrastructure
        run: |
          set +e
          DEPLOY_OUT=$(npx wrangler deploy 2>&1)
          DEPLOY_EXIT=$?
          # The account workers.dev subdomain carries a personal name: it is never printed. The raw output stays in the variable, only the redacted text reaches the log.
          SUB=$(printf '%s' "$DEPLOY_OUT" | grep -oE '\.[a-z0-9-]+\.workers\.dev' | head -n 1 | sed -E 's#^\.([a-z0-9-]+)\.workers\.dev$#\1#' || true)
          if printf '%s' "$SUB" | grep -qE '^[a-z0-9-]+$'; then echo "::add-mask::$SUB"; fi
          echo "$DEPLOY_OUT" | sed -E 's#\.[a-z0-9-]+\.workers\.dev#.<account-subdomain>.workers.dev#g'
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::wrangler deploy failed with exit code $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi
          set -e
          # Production is stamped with its own API origin and nothing else: no workers.dev host (it would be accepted as a key destination by the page). The URL is not parsed out of the deploy output any more.
          WORKER_URL="https://api.leeroy.party"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Create missing Flagship flags (disabled; never changes an existing flag)
        # After the Worker is deployed. Lists the Flagship app and creates only the keys of infrastructure/flagship-flags.txt that are absent, with
        # `wrangler flagship flags create <APP_ID> <KEY> --disabled --remote`. Never enables, updates, disables or deletes anything. A problem is a warning, never a failed deploy.
        # Production job only: tests/unit/workflow-secrets.test.mjs fails if any other workflow references it. See docs/runbooks/flags.md.
        continue-on-error: true
        timeout-minutes: 3
        working-directory: infrastructure
        run: node ../tools/flagship-ensure-flags.mjs

      - name: Sync Worker Secrets (AI Providers, Admin Token, Discord)
        working-directory: infrastructure
        env:
          # Dedicated AI Gateway secrets only. The account-wide CLOUDFLARE_API_TOKEN must never become a Worker secret.
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN || secrets.CLOUDFLARE_AIG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BOARD_ADMIN_TOKEN: ${{ secrets.BOARD_ADMIN_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          USER_SALT: ${{ secrets.USER_SALT }}
          KEY_SALT: ${{ secrets.KEY_SALT }}
        run: |
          for SECRET_NAME in AI_GATEWAY_TOKEN ANTHROPIC_API_KEY GEMINI_API_KEY GROQ_API_KEY CEREBRAS_API_KEY GITHUB_MODELS_TOKEN OPENROUTER_API_KEY BOARD_ADMIN_TOKEN DISCORD_WEBHOOK_URL DISCORD_PUBLIC_KEY DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN USER_SALT KEY_SALT; do
            SECRET_VAL="${!SECRET_NAME}"
            if [ -n "$SECRET_VAL" ]; then
              printf "%s" "$SECRET_VAL" | npx wrangler secret put "$SECRET_NAME"
            elif [ "$SECRET_NAME" = "AI_GATEWAY_TOKEN" ]; then
              echo "::warning::Neither AI_GATEWAY_TOKEN nor CLOUDFLARE_AIG_TOKEN is set; not updating the AI Gateway token secret. Any existing Worker value is kept. The deploy token is never used as a fallback. See docs/runbooks/secrets.md."
            fi
          done

      - name: Stage Static Site Bundle & Deploy to Cloudflare Pages Production
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        run: |
          set -e
          # The bundle is staged by tools/pages-bundle.mjs (shared by the production deploy and the PR preview). It leaves out the member data files
          # (the Worker serves those through its privacy projection) and fails this step when one is present. docs/runbooks/member-data-worker-only.md
          node tools/pages-bundle.mjs .cloudflare-dist

          # The Worker URL is stamped into JavaScript: accept only https://api.leeroy.party, refuse anything else.
          if [ "$WORKER_URL" != "https://api.leeroy.party" ]; then
            echo "::error::The Worker URL does not have the shape https://<name>[.<subdomain>].workers.dev (or the production API origin); refusing to stamp it into the site bundle."
            exit 1
          fi
          # Stamp the resolved production Worker URL into .cloudflare-dist/js/brain.js
          node -e '
            const fs = require("fs");
            const p = ".cloudflare-dist/js/brain.js";
            const s = fs.readFileSync(p, "utf8");
            const url = process.argv[1]; fs.writeFileSync(p, s.replace(/const WORKER = "[^"]+";/, () => `const WORKER = "${url}";`), "utf8");
          ' "$WORKER_URL"

          cd infrastructure
          npx wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch=master >/dev/null 2>&1 || true
          npx wrangler pages deploy ../.cloudflare-dist --project-name="$PAGES_PROJECT_NAME" --branch=master --commit-dirty=true

      - name: Ensure Custom Domains (leeroy.party & www.leeroy.party) Attached to Pages
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Ensuring leeroy.party and www.leeroy.party are attached to Pages project '$PAGES_PROJECT_NAME'..."
            for DOMAIN in "leeroy.party" "www.leeroy.party"; do
              RES=$(curl -s -w "\n%{http_code}" -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT_NAME}/domains" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"name\":\"${DOMAIN}\"}")
              HTTP_CODE=$(echo "$RES" | tail -n 1)
              BODY=$(echo "$RES" | head -n -1)
              echo "Custom domain $DOMAIN configuration (HTTP $HTTP_CODE): $BODY"
            done
          fi

      - name: Post-deploy health check (api.leeroy.party/api/health)
        run: |
          # At most 5 requests, 10 s apart. Needs HTTP 200, a JSON body, ok true and db "ok" (a trivial D1 query in the Worker).
          URL="https://api.leeroy.party/api/health"
          for ATTEMPT in 1 2 3 4 5; do
            CODE=$(curl -s -o health.json -w '%{http_code}' --max-time 15 -H 'Accept: application/json' "$URL" || true)
            if [ "$CODE" = "200" ] && node -e '
              const b = JSON.parse(require("fs").readFileSync("health.json", "utf8"));
              process.exit(b && b.ok === true && b.db === "ok" ? 0 : 1);
            ' 2>/dev/null; then
              echo "Health check passed on attempt $ATTEMPT (HTTP 200, ok true, db ok)."
              exit 0
            fi
            echo "Health attempt $ATTEMPT of 5 failed (HTTP ${CODE:-none}); body (first 200 chars): $(head -c 200 health.json 2>/dev/null | tr -d '\r\n')"
            [ "$ATTEMPT" -lt 5 ] && sleep 10
          done
          echo "::error::Post-deploy health check failed: $URL did not return HTTP 200 JSON with ok true and db ok after 5 tries. The Worker or its D1 database may be broken. Roll back: docs/runbooks/rollback.md."
          exit 1

      # Runs only after the Worker is deployed, its secrets are synced and the health check passed, so the manifest it reads already lists every command in this commit
      # (for example /say). POSTs only the missing or different commands, one by one; never a bulk PUT, never a DELETE. Never fails the deploy: any trouble is a ::warning::.
      - name: Sync Discord slash commands (idempotent, never deletes)
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WORKER_URL: https://api.leeroy.party
        run: node tools/sync-discord-commands.mjs --apply

  # Closes the sticky "Production is behind master" issue once a deploy has succeeded. Its own job so that the production deploy job's token needs no write permission on issues.
  clear-behind-notice:
    name: Close the production-is-behind notice
    needs: deploy-production
    if: github.ref == 'refs/heads/master' && needs.deploy-production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the notice
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- production-behind-master -->";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            for (const i of issues.filter((x) => !x.pull_request && x.body && x.body.includes(marker))) {
              await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: "Deployed master " + context.sha.slice(0, 7) + " (" + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId + "): production is in step with master as of this run." });
              await github.rest.issues.update({ owner, repo, issue_number: i.number, state: "closed", state_reason: "completed" });
            }

  # After each production deploy: the light health check in the deploy job above (at most 5 requests, usually 1) plus THIS job, tests/browser/deploy-smoke.mjs: /api/health, /api/bootstrap and
  # /api/state answer 200 with the expected shape, then one page load in Chromium and one in WebKit renders the first screen with the live API without a 5xx. About 15 Worker requests in all.
  # It replaces the full production probe (tests/browser/prod-probe.mjs: three engines, two sizes, every scene, about 165 Worker requests), which ran after EVERY deploy: with the account owner's
  # 2,000 Worker requests a day and up to 16 deploys a day that was 2,640 requests from the probe alone (the steward's FOOTPRINT.md, RULES.md open item 4). The full probe still runs once a day
  # (.github/workflows/prod-probe-daily.yml) and is the alarm for what a visitor sees.
  # This job holds no secret (no environment, no job-level env, GITHUB_TOKEN read-only), reports only and never rolls back, redeploys or edits Cloudflare. NON-BLOCKING (B62): a failure shows as an
  # annotation and a step summary on the run and does not turn the deploy red; remove continue-on-error after 3 consecutive clean runs.
  post-deploy-smoke:
    name: Post-deploy smoke (health and the first screen, about 15 Worker requests; reports only, never rolls back)
    needs: deploy-production
    if: github.ref == 'refs/heads/master'
    continue-on-error: true
    runs-on: ubuntu-24.04
    # The browsers and their system libraries come from the official Playwright image, so nothing here runs apt. Before 2026-11-24 this job ran `playwright install --with-deps`, which spends its time in apt:
    # on the runner pool whose image build is baked to the us-east-2.ec2 mirror that ran at 0.17 to 0.45 MB/s (run 45297981246, both attempts cancelled at the 15 minute limit; 45293738617 job 138110591968 needed 12m55s).
    # The tag must equal "playwright" in tests/package.json (tests/unit/production-smoke-job.test.mjs pins that), the digest pins the amd64 and arm64 images the tag pointed at on 2026-11-24.
    # To move it: curl -sI -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' https://mcr.microsoft.com/v2/playwright/manifests/<tag> | grep -i docker-content-digest
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble@sha256:70e367e0cbf60340a5b5fd562f6247a34eb3196efab9f88a3dd56482d9fe09d2
      options: --ipc=host --init
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: production-probe
      cancel-in-progress: false
    env:
      SMOKE_REQUIRE_ENGINES: "1"
      PREVIEW_API: https://api.leeroy.party
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The image carries Node 22 (its Dockerfile uses node_22.x), so there is no setup-node step. No apt, no browser download: npm only. A failure here fails the job.
      - name: Install the test dependencies (npm only)
        working-directory: tests
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Let the new Pages build reach the edge
        run: sleep 45

      # Says which commit was tested: the ?v= stamps of the page leeroy.party serves must equal this checkout's (tools/served-stamps.mjs, 1 to 6 page GETs). It fails the job when they differ or cannot be read, for example when a
      # newer deploy has already replaced this one (the job is non-blocking; the log then says so).
      - name: Check which commit production serves
        timeout-minutes: 4
        shell: bash
        run: node tools/served-stamps.mjs --url https://leeroy.party/ | tee "$RUNNER_TEMP/served-stamps.log"

      # tools/production-smoke.sh fails the step when the log lacks the Chromium and the WebKit "first screen renders" lines, so a smoke that did not launch both browsers cannot pass.
      - name: Deploy smoke (about 15 Worker requests)
        timeout-minutes: 8
        run: bash tools/production-smoke.sh https://leeroy.party/

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: deploy-smoke-log
          path: |
            ${{ runner.temp }}/deploy-smoke.log
            ${{ runner.temp }}/served-stamps.log
          if-no-files-found: ignore
          retention-days: 14
