name: Deploy Site & Serverless Backend to Cloudflare (Production)

on:
  push:
    branches:
      - master

concurrency:
  group: cloudflare-production-master
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Worker, D1 & Static Site to Cloudflare Production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: leeroy-board-db
      PAGES_PROJECT_NAME: leeroy-board

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Require salt secrets before deploying
        env:
          USER_SALT: ${{ secrets.USER_SALT }}
          KEY_SALT: ${{ secrets.KEY_SALT }}
        run: |
          # USER_SALT and KEY_SALT are Worker secrets, no longer wrangler.toml vars. Without them the Worker
          # refuses guest asks, votes, Discord login and member keys, so stop before replacing the live Worker.
          for N in USER_SALT KEY_SALT; do
            if [ -z "${!N}" ]; then
              echo "::error::Repository secret $N is missing. The owner must create it (same value as before, so existing hashes stay valid). See docs/runbooks/secrets.md."
              exit 1
            fi
          done

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler CLI
        working-directory: infrastructure
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare Credentials & Scope Diagnostics
        working-directory: infrastructure
        run: |
          set -e
          echo "=== Cloudflare Credential & Account Pre-flight Check ==="

          # Sanitize whitespace / carriage returns / quotes
          CLEAN_TOKEN=$(echo "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ' | sed -e 's/^["\x27]//' -e 's/["\x27]$//')
          CLEAN_ACC=$(echo "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n ' | sed -e 's/^["\x27]//' -e 's/["\x27]$//')

          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or missing in GitHub Secrets."
            exit 1
          fi

          # 1. Verify token status against Cloudflare verify endpoint
          VERIFY_RES=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          TOKEN_STATUS=$(node -e 'try { const j = JSON.parse(process.argv[1]); console.log(j.result?.status || (j.success ? "active" : "failed")); } catch(e) { console.log("failed"); }' "$VERIFY_RES")

          if [ "$TOKEN_STATUS" != "active" ]; then
            echo "::error::Cloudflare API Token validation failed. Status: $TOKEN_STATUS"
            echo "Raw response from Cloudflare: $VERIFY_RES"
            echo ""
            echo "Action Required:"
            echo "1. Verify CLOUDFLARE_API_TOKEN is a valid API Token (not a Global API Key)."
            echo "2. Check that the token is Active in Cloudflare Dashboard -> My Profile -> API Tokens."
            exit 1
          fi
          echo "✓ Cloudflare API Token is ACTIVE and verified."

          # 2. Check accounts the token has access to
          ACCOUNTS_RES=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          ACC_INFO=$(node -e '
            try {
              const j = JSON.parse(process.argv[1]);
              const accs = j.result || [];
              const target = process.env.TARGET_ID;
              const match = accs.find(a => a.id === target);
              if (match) {
                console.log("MATCH:" + match.id + ":" + match.name);
              } else if (accs.length === 1) {
                console.log("RESOLVED_SINGLE:" + accs[0].id + ":" + accs[0].name);
              } else if (accs.length > 1) {
                console.log("MULTIPLE:" + accs.map(a => `${a.name} (${a.id})`).join(", "));
              } else {
                console.log("NONE");
              }
            } catch(e) {
              console.log("PARSE_ERROR");
            }
          ' "$ACCOUNTS_RES")

          TARGET_ACCOUNT_ID="$CLEAN_ACC"
          if [[ "$ACC_INFO" == MATCH:* ]]; then
            ACC_ID=$(echo "$ACC_INFO" | cut -d: -f2)
            ACC_NAME=$(echo "$ACC_INFO" | cut -d: -f3)
            echo "✓ Account ID matches token: '$ACC_NAME' ($ACC_ID)"
          elif [[ "$ACC_INFO" == RESOLVED_SINGLE:* ]]; then
            ACC_ID=$(echo "$ACC_INFO" | cut -d: -f2)
            ACC_NAME=$(echo "$ACC_INFO" | cut -d: -f3)
            echo "::notice::Auto-resolved Cloudflare Account ID: '$ACC_NAME' ($ACC_ID)"
            TARGET_ACCOUNT_ID="$ACC_ID"
          elif [[ "$ACC_INFO" == MULTIPLE:* ]]; then
            echo "::error::Provided Account ID '$CLEAN_ACC' does not match any accounts this token can access."
            echo "Available accounts for this token: ${ACC_INFO#MULTIPLE:}"
            exit 1
          else
            echo "::warning::Could not query /accounts via token. Proceeding with provided Account ID: $CLEAN_ACC"
          fi

          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$TARGET_ACCOUNT_ID" >> "$GITHUB_ENV"

          # 3. Test D1 permissions specifically
          D1_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$TARGET_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          D1_SUCCESS=$(node -e 'try { const j = JSON.parse(process.argv[1]); console.log(j.success ? "true" : "false"); } catch(e) { console.log("false"); }' "$D1_CHECK")

          if [ "$D1_SUCCESS" != "true" ]; then
            echo "::error::Token lacks D1 permissions for account '$TARGET_ACCOUNT_ID'."
            echo "Cloudflare response: $D1_CHECK"
            echo ""
            echo "Action Required to Fix (Authentication error 10000 on D1):"
            echo "In Cloudflare Dashboard -> My Profile (top-right avatar) -> API Tokens:"
            echo "1. Edit the token used for CLOUDFLARE_API_TOKEN."
            echo "2. Under 'Permissions', click '+ Add more' and add: 'Account' -> 'D1' -> 'Edit'."
            echo "3. Also ensure 'Account' -> 'Cloudflare Pages' -> 'Edit' is present."
            echo "4. Save token and re-run workflow."
            exit 1
          fi
          echo "✓ Cloudflare D1 permissions verified."

          # 4. Test Zone permissions for leeroy.party (required for custom domain api.leeroy.party)
          ZONE_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=leeroy.party" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          ZONE_SUCCESS=$(node -e '
            try {
              const j = JSON.parse(process.argv[1]);
              console.log(j.success ? "true" : "false");
            } catch(e) {
              console.log("false");
            }
          ' "$ZONE_CHECK")
          ZONE_COUNT=$(node -e '
            try {
              const j = JSON.parse(process.argv[1]);
              console.log(j.result ? j.result.length : 0);
            } catch(e) {
              console.log("0");
            }
          ' "$ZONE_CHECK")

          if [ "$ZONE_SUCCESS" != "true" ]; then
            echo "::error::Token lacks Zone Read permissions for leeroy.party."
            echo "Cloudflare response: $ZONE_CHECK"
            echo ""
            echo "Action Required to Fix:"
            echo "In Cloudflare Dashboard -> My Profile -> API Tokens:"
            echo "1. Edit the token used for CLOUDFLARE_API_TOKEN (e.g. 'Leeroy Dungeons and Drinking Key')."
            echo "2. Under 'Permissions', click '+ Add more' and add: 'Zone' -> 'Zone' -> 'Read'."
            echo "3. Under 'Zone Resources', ensure 'Include' -> 'Specific zone' includes 'leeroy.party' (or 'All zones')."
            echo "4. Save token and re-run workflow."
            exit 1
          fi

          if [ "$ZONE_COUNT" = "0" ]; then
            echo "::warning::Zone 'leeroy.party' was not found in Cloudflare account '$TARGET_ACCOUNT_ID'."
          else
            echo "✓ Cloudflare Zone permissions verified for leeroy.party."
          fi

      - name: Ensure D1 Database Exists & Patch wrangler.toml
        working-directory: infrastructure
        run: |
          set -e
          echo "Checking for existing D1 database '$D1_DATABASE_NAME'..."
          LIST_JSON=$(npx wrangler d1 list --json)
          DB_ID=$(node -e '
            const list = JSON.parse(process.argv[1] || "[]");
            const found = list.find(d => d.name === process.env.D1_DATABASE_NAME);
            if (found) process.stdout.write(found.uuid);
          ' "$LIST_JSON")

          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database '$D1_DATABASE_NAME'..."
            CREATE_OUT=$(npx wrangler d1 create "$D1_DATABASE_NAME")
            echo "$CREATE_OUT"
            DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' | head -n 1)
          fi

          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not resolve D1 database_id"
            exit 1
          fi

          echo "Resolved D1 database_id: $DB_ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/g" wrangler.toml

      - name: Apply Unified D1 Schema (`schema.sql`) & Pending Migrations
        working-directory: infrastructure
        run: |
          set -e
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=./schema.sql
          if [ -d "migrations" ] && [ -n "$(find migrations -maxdepth 1 -name '*.sql' 2>/dev/null)" ]; then
            echo "Applying numbered migrations..."
            npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote
          else
            echo "Initial database deployment: unified schema.sql applied with zero migrations."
          fi

      - name: Seed Initial Board & Library Data into D1 (if empty)
        working-directory: infrastructure
        run: |
          set -e
          COUNT_JSON=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command="SELECT COUNT(*) AS n FROM kv_state;" --json)
          ROW_COUNT=$(node -e '
            const res = JSON.parse(process.argv[1] || "[]");
            const n = res?.[0]?.results?.[0]?.n ?? 0;
            process.stdout.write(String(n));
          ' "$COUNT_JSON")

          echo "Current kv_state row count in D1: $ROW_COUNT"
          if [ "$ROW_COUNT" = "0" ]; then
            echo "Seeding D1 from repository data/*.json and data/library/*.json..."
            node ./scripts/seed-d1.mjs --remote
          else
            echo "D1 already contains live state ($ROW_COUNT rows). Skipping seed to preserve live edits."
          fi

      - name: Deploy Cloudflare Worker + Durable Object + Cron Trigger
        id: worker
        working-directory: infrastructure
        run: |
          set +e
          DEPLOY_OUT=$(npx wrangler deploy 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::wrangler deploy failed with exit code $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi
          set -e
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oE "https://api\.leeroy\.party" | head -n 1)
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oE "https://leeroy-brain\.[a-z0-9-]+\.workers\.dev" | head -n 1)
          fi
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="https://api.leeroy.party"
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Sync Worker Secrets (AI Providers, Admin Token, Discord)
        working-directory: infrastructure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BOARD_ADMIN_TOKEN: ${{ secrets.BOARD_ADMIN_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          USER_SALT: ${{ secrets.USER_SALT }}
          KEY_SALT: ${{ secrets.KEY_SALT }}
        run: |
          for SECRET_NAME in ANTHROPIC_API_KEY GEMINI_API_KEY GROQ_API_KEY CEREBRAS_API_KEY GITHUB_MODELS_TOKEN OPENROUTER_API_KEY BOARD_ADMIN_TOKEN DISCORD_WEBHOOK_URL DISCORD_PUBLIC_KEY DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN USER_SALT KEY_SALT; do
            SECRET_VAL="${!SECRET_NAME}"
            if [ -n "$SECRET_VAL" ]; then
              printf "%s" "$SECRET_VAL" | npx wrangler secret put "$SECRET_NAME"
            fi
          done

      - name: Stage Static Site Bundle & Deploy to Cloudflare Pages Production
        run: |
          set -e
          mkdir -p .cloudflare-dist
          for item in index.html _headers og-1200x630.jpg robots.txt atlas cloth css data fonts img js landing next room scenes vendor; do
            if [ -e "$item" ]; then
              cp -R "$item" .cloudflare-dist/
            fi
          done

          # Stamp the resolved production Worker URL into .cloudflare-dist/js/brain.js
          node -e '
            const fs = require("fs");
            const p = ".cloudflare-dist/js/brain.js";
            const s = fs.readFileSync(p, "utf8");
            fs.writeFileSync(p, s.replace(/const WORKER = "[^"]+";/, `const WORKER = "${process.argv[1]}";`), "utf8");
          ' "${{ steps.worker.outputs.worker_url }}"

          cd infrastructure
          npx wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch=master >/dev/null 2>&1 || true
          npx wrangler pages deploy ../.cloudflare-dist --project-name="$PAGES_PROJECT_NAME" --branch=master --commit-dirty=true

      - name: Ensure Custom Domains (leeroy.party & www.leeroy.party) Attached to Pages
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Ensuring leeroy.party and www.leeroy.party are attached to Pages project '$PAGES_PROJECT_NAME'..."
            for DOMAIN in "leeroy.party" "www.leeroy.party"; do
              RES=$(curl -s -w "\n%{http_code}" -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT_NAME}/domains" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"name\":\"${DOMAIN}\"}")
              HTTP_CODE=$(echo "$RES" | tail -n 1)
              BODY=$(echo "$RES" | head -n -1)
              echo "Custom domain $DOMAIN configuration (HTTP $HTTP_CODE): $BODY"
            done
          fi
