name: PR Ephemeral Preview Environment (Cloudflare Free Tier)

# The preview exists only while the PR carries the label `ci-full` (GitHub minutes are metered, docs/runbooks/ci-minutes.md):
#   opened / synchronize / reopened / labeled ci-full, with the label present -> prep, then deploy (spin up or refresh the preview)
#   closed, or unlabeled ci-full                                           -> teardown (one job; exits early when no preview D1 exists), frees a D1 slot
# A PR without the label costs nothing here: every job is skipped. Label events other than ci-full skip every job and never cancel a running spin-up.
# Teardown never depends on label history: it looks for the D1 database of this PR number.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - labeled
      - unlabeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-full') }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # One cheap job for the three former tiny jobs: fork policy, path classification (docs-only PRs get no preview and no D1 database) and the docs-only note.
  # Same-repo PRs without `ci-full` skip it (0 minutes); fork PRs only run the policy step.
  prep:
    name: Fork policy and classify
    if: >-
      (github.event.pull_request.head.repo.full_name != github.repository && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) ||
      (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci-full') &&
       (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'ci-full')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Enforce the fork PR policy
        run: |
          IS_FORK="${{ github.event.pull_request.head.repo.full_name != github.repository }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "Head repository: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "Base repository: ${{ github.repository }}"
          echo "Base branch: $BASE_BRANCH"
          echo "Is fork PR: $IS_FORK"
          if [ "$IS_FORK" = "true" ] && [ "$BASE_BRANCH" = "master" ]; then
            echo "::error::Fork pull requests cannot be merged directly into 'master'. Fork pull requests must target a non-master branch (e.g. an integration or feature branch)."
            exit 1
          fi

      - name: Checkout PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Classify the changed paths
        id: classify
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths.txt"
          cat "$RUNNER_TEMP/paths.txt"
          echo "docs_only=$(node tools/docs-only.mjs < "$RUNNER_TEMP/paths.txt")" >> "$GITHUB_OUTPUT"

      - name: Say that tests run without a preview
        if: steps.classify.outputs.docs_only == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview-skipped -->";
            const prNumber = context.payload.pull_request.number;
            const body = [marker, "### Cloudflare PR preview skipped (docs only)", "",
              "This PR changes only `docs/**`, root `*.md` files or `.github/ISSUE_TEMPLATE/**`, so no preview environment (and no D1 database) was created. Preview Tests run only the unit and stamps suites."].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });

  deploy-pr-preview:
    name: Spin Up Isolated PR Preview (Pages + Worker + D1 + DO)
    needs: prep
    # prep runs for same-repo PRs only with the label `ci-full` (and for forks, which never get a preview), so this is the single spin-up condition.
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.prep.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      WORKER_NAME: leeroy-brain-pr-${{ github.event.pull_request.number }}
      D1_DATABASE_NAME: leeroy-board-db-pr-${{ github.event.pull_request.number }}
      PAGES_PROJECT_NAME: leeroy-board
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install Wrangler CLI
        working-directory: infrastructure
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare Credentials & Scope Diagnostics
        working-directory: infrastructure
        run: |
          set -e
          echo "=== Cloudflare Credential & Account Pre-flight Check ==="

          # Sanitize whitespace / carriage returns / quotes
          CLEAN_TOKEN=$(echo "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ' | sed -e 's/^["\x27]//' -e 's/["\x27]$//')
          CLEAN_ACC=$(echo "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n ' | sed -e 's/^["\x27]//' -e 's/["\x27]$//')

          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or missing in GitHub Secrets."
            exit 1
          fi

          # 1. Verify token status against Cloudflare verify endpoint
          VERIFY_RES=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          TOKEN_STATUS=$(node -e 'try { const j = JSON.parse(process.argv[1]); console.log(j.result?.status || (j.success ? "active" : "failed")); } catch(e) { console.log("failed"); }' "$VERIFY_RES")

          if [ "$TOKEN_STATUS" != "active" ]; then
            echo "::error::Cloudflare API Token validation failed. Status: $TOKEN_STATUS"
            echo "Raw response from Cloudflare: $VERIFY_RES"
            echo ""
            echo "Action Required:"
            echo "1. Verify CLOUDFLARE_API_TOKEN is a valid API Token (not a Global API Key)."
            echo "2. Check that the token is Active in Cloudflare Dashboard -> My Profile -> API Tokens."
            exit 1
          fi
          echo "✓ Cloudflare API Token is ACTIVE and verified."

          # 2. Check accounts the token has access to
          ACCOUNTS_RES=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          ACC_INFO=$(node -e '
            try {
              const j = JSON.parse(process.argv[1]);
              const accs = j.result || [];
              const target = process.env.TARGET_ID;
              const match = accs.find(a => a.id === target);
              if (match) {
                console.log("MATCH:" + match.id + ":" + match.name);
              } else if (accs.length === 1) {
                console.log("RESOLVED_SINGLE:" + accs[0].id + ":" + accs[0].name);
              } else if (accs.length > 1) {
                console.log("MULTIPLE:" + accs.map(a => `${a.name} (${a.id})`).join(", "));
              } else {
                console.log("NONE");
              }
            } catch(e) {
              console.log("PARSE_ERROR");
            }
          ' "$ACCOUNTS_RES")

          TARGET_ACCOUNT_ID="$CLEAN_ACC"
          if [[ "$ACC_INFO" == MATCH:* ]]; then
            ACC_ID=$(echo "$ACC_INFO" | cut -d: -f2)
            ACC_NAME=$(echo "$ACC_INFO" | cut -d: -f3)
            echo "✓ Account ID matches token: '$ACC_NAME' ($ACC_ID)"
          elif [[ "$ACC_INFO" == RESOLVED_SINGLE:* ]]; then
            ACC_ID=$(echo "$ACC_INFO" | cut -d: -f2)
            ACC_NAME=$(echo "$ACC_INFO" | cut -d: -f3)
            echo "::notice::Auto-resolved Cloudflare Account ID: '$ACC_NAME' ($ACC_ID)"
            TARGET_ACCOUNT_ID="$ACC_ID"
          elif [[ "$ACC_INFO" == MULTIPLE:* ]]; then
            echo "::error::Provided Account ID '$CLEAN_ACC' does not match any accounts this token can access."
            echo "Available accounts for this token: ${ACC_INFO#MULTIPLE:}"
            exit 1
          else
            echo "::warning::Could not query /accounts via token. Proceeding with provided Account ID: $CLEAN_ACC"
          fi

          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$TARGET_ACCOUNT_ID" >> "$GITHUB_ENV"

          # 3. Test D1 permissions specifically
          D1_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$TARGET_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          D1_SUCCESS=$(node -e 'try { const j = JSON.parse(process.argv[1]); console.log(j.success ? "true" : "false"); } catch(e) { console.log("false"); }' "$D1_CHECK")

          if [ "$D1_SUCCESS" != "true" ]; then
            echo "::error::Token lacks D1 permissions for account '$TARGET_ACCOUNT_ID'."
            echo "Cloudflare response: $D1_CHECK"
            echo ""
            echo "Action Required to Fix (Authentication error 10000 on D1):"
            echo "In Cloudflare Dashboard -> My Profile (top-right avatar) -> API Tokens:"
            echo "1. Edit the token used for CLOUDFLARE_API_TOKEN."
            echo "2. Under 'Permissions', click '+ Add more' and add: 'Account' -> 'D1' -> 'Edit'."
            echo "3. Also ensure 'Account' -> 'Cloudflare Pages' -> 'Edit' is present."
            echo "4. Save token and re-run workflow."
            exit 1
          fi
          echo "✓ Cloudflare D1 permissions verified."

      - name: Provision Ephemeral D1 Database & Configure PR `wrangler.toml`
        id: d1
        working-directory: infrastructure
        run: |
          set -e
          echo "Checking for ephemeral D1 database '$D1_DATABASE_NAME'..."
          LIST_JSON=$(npx wrangler d1 list --json)
          DB_ID=$(node -e '
            const list = JSON.parse(process.argv[1] || "[]");
            const found = list.find(d => d.name === process.env.D1_DATABASE_NAME);
            if (found) process.stdout.write(found.uuid);
          ' "$LIST_JSON")

          if [ -z "$DB_ID" ]; then
            echo "Creating ephemeral D1 database '$D1_DATABASE_NAME'..."
            set +e
            CREATE_OUT=$(npx wrangler d1 create "$D1_DATABASE_NAME" 2>&1)
            CREATE_EXIT=$?
            set -e
            echo "$CREATE_OUT"
            if [ $CREATE_EXIT -ne 0 ]; then
              # 7406 = "System limit reached: databases per account (10)". See docs/runbooks/preview-d1-limit.md.
              if echo "$CREATE_OUT" | grep -qE '(^|[^0-9])7406([^0-9]|$)'; then
                echo "limit_reached=true" >> "$GITHUB_OUTPUT"
                echo "::error::Preview limit reached (D1 error 7406); a slot must free up before this PR gets a preview."
              fi
              exit $CREATE_EXIT
            fi
            DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' | head -n 1)
          fi

          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not resolve ephemeral D1 database_id"
            exit 1
          fi

          # Patch wrangler.toml with PR-specific Worker name, D1 name/ID, set AI_PROVIDER="workers-ai",
          # mark IS_PR_PREVIEW="true", add PR Pages preview to ALLOWED_ORIGINS, and remove [triggers]
          # so PR previews do not consume the 5-Cron-Trigger Free-Tier account limit.
          node -e '
            const fs = require("fs");
            let toml = fs.readFileSync("wrangler.toml", "utf8");
            toml = toml.replace(/^name\s*=\s*".*"/m, `name = "${process.env.WORKER_NAME}"`);
            toml = toml.replace(/database_name\s*=\s*".*"/, `database_name = "${process.env.D1_DATABASE_NAME}"`);
            toml = toml.replace(/database_id\s*=\s*".*"/, `database_id = "${process.argv[1]}"`);
            toml = toml.replace(/routes\s*=\s*\[[\s\S]*?\]\r?\n?/, "");
            toml = toml.replace(/\[triggers\][\s\S]*?crons\s*=\s*\[[^\]]*\]\r?\n?/, "");
            toml = toml.replace(/AI_PROVIDER\s*=\s*".*"/, `AI_PROVIDER = "workers-ai"`);
            const prOrigin = `https://${process.env.PAGES_BRANCH}.${process.env.PAGES_PROJECT_NAME}.pages.dev`;
            toml = toml.replace(/ALLOWED_ORIGINS\s*=\s*"([^"]*)"/, (m, orig) => `ALLOWED_ORIGINS = "${orig},${prOrigin}"`);
            toml = toml.replace(/BOARD_PUBLIC_URL\s*=\s*".*"/, `BOARD_PUBLIC_URL = "${prOrigin}"`);
            if (process.env.CLOUDFLARE_ACCOUNT_ID) {
              toml = toml.replace(/CLOUDFLARE_ACCOUNT_ID = ""/, `CLOUDFLARE_ACCOUNT_ID = "${process.env.CLOUDFLARE_ACCOUNT_ID}"`);
            }
            if (!toml.includes("IS_PR_PREVIEW")) {
              toml = toml.replace(/\[vars\]/, `[vars]\nIS_PR_PREVIEW = "true"\nWORKER_NAME = "${process.env.WORKER_NAME}"`);
            }
            fs.writeFileSync("wrangler.toml", toml, "utf8");
          ' "$DB_ID"

      - name: Say that the preview limit is reached
        if: failure() && steps.d1.outputs.limit_reached == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview-limit -->";
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [marker, `### Preview limit reached (\`${sha}\`)`, "",
              "Preview limit reached; will retry when a slot frees.",
              "", "The Cloudflare Free plan allows 10 D1 databases per account and every open PR uses one (error 7406). When another PR is merged, closed or loses its `ci-full` label, its slot is released and this PR's failed preview and test jobs are re-run automatically. See `docs/runbooks/preview-d1-limit.md`."].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });

      - name: Apply Unified D1 Schema (`schema.sql`), Migrations & Seed Ephemeral Database
        working-directory: infrastructure
        run: |
          set -e
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=./schema.sql
          if [ -d "migrations" ] && [ -n "$(find migrations -maxdepth 1 -name '*.sql' 2>/dev/null)" ]; then
            echo "Applying numbered migrations..."
            npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote
          else
            echo "Initial database deployment: unified schema.sql applied with zero migrations."
          fi

          COUNT_JSON=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command="SELECT COUNT(*) AS n FROM kv_state;" --json)
          ROW_COUNT=$(node -e '
            const res = JSON.parse(process.argv[1] || "[]");
            const n = res?.[0]?.results?.[0]?.n ?? 0;
            process.stdout.write(String(n));
          ' "$COUNT_JSON")

          if [ "$ROW_COUNT" = "0" ]; then
            echo "Seeding ephemeral PR D1 database '$D1_DATABASE_NAME'..."
            D1_DATABASE_NAME="$D1_DATABASE_NAME" node ./scripts/seed-d1.mjs --remote
          fi

      - name: Deploy Ephemeral PR Worker & Durable Object (Single Deploy)
        id: worker
        working-directory: infrastructure
        env:
          BOARD_ADMIN_TOKEN: ${{ secrets.BOARD_ADMIN_TOKEN }}
        run: |
          set +e
          # Deploy Worker once; pass BOARD_ADMIN_TOKEN directly to avoid double redeployment
          if [ -n "$BOARD_ADMIN_TOKEN" ]; then
            DEPLOY_OUT=$(npx wrangler deploy --var BOARD_ADMIN_TOKEN:"$BOARD_ADMIN_TOKEN" 2>&1)
          else
            DEPLOY_OUT=$(npx wrangler deploy 2>&1)
          fi
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::wrangler deploy failed with exit code $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi
          set -e
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oE "https://${WORKER_NAME}\.[a-z0-9-]+\.workers\.dev" | head -n 1)
          if [ -z "$WORKER_URL" ]; then
            SUBDOMAIN=$(npx wrangler subdomain get 2>/dev/null | grep -oE '[a-z0-9-]+' | head -n 1 || true)
            if [ -n "$SUBDOMAIN" ]; then
              WORKER_URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
            else
              WORKER_URL="https://${WORKER_NAME}.jmattbloise.workers.dev"
            fi
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Set Preview Salt Secrets (derived per preview)
        working-directory: infrastructure
        env:
          USER_SALT: ${{ secrets.USER_SALT }}
          KEY_SALT: ${{ secrets.KEY_SALT }}
        run: |
          set -e
          # Each preview gets its own salts: HMAC-SHA256 of the Worker name keyed by the repository secret.
          # The preview value differs from production and from every other preview, and the repository secret is never copied.
          # If a repository secret is missing the Worker fails closed (503 salt_not_configured); the preview still deploys.
          for SECRET_NAME in USER_SALT KEY_SALT; do
            BASE="${!SECRET_NAME}"
            if [ -z "$BASE" ]; then
              echo "::warning::Repository secret $SECRET_NAME is missing: preview $WORKER_NAME will refuse salt-dependent requests."
              continue
            fi
            DERIVED=$(printf '%s' "preview:$SECRET_NAME:$WORKER_NAME" | openssl dgst -sha256 -hmac "$BASE" -r | cut -d' ' -f1)
            echo "::add-mask::$DERIVED"
            printf '%s' "$DERIVED" | npx wrangler secret put "$SECRET_NAME" >/dev/null
            echo "Set $SECRET_NAME on $WORKER_NAME (derived, value not shown)."
          done

      - name: Stage Static Site (Wired to PR Worker) & Deploy to Cloudflare Pages Preview
        id: pages
        run: |
          set -e
          mkdir -p .cloudflare-dist
          for item in index.html 404.html privacy terms _headers og-1200x630.jpg robots.txt atlas cloth css data fonts img js landing next room scenes vendor; do
            if [ -e "$item" ]; then
              cp -R "$item" .cloudflare-dist/
            fi
          done

          # Stamp the exact PR Worker URL into .cloudflare-dist/js/brain.js so both the branch alias URL
          # and the per-commit hash URL talk directly to this PR's isolated Worker + D1.
          node -e '
            const fs = require("fs");
            const p = ".cloudflare-dist/js/brain.js";
            const s = fs.readFileSync(p, "utf8");
            fs.writeFileSync(p, s.replace(/const WORKER = "[^"]+";/, `const WORKER = "${process.argv[1]}";`), "utf8");
          ' "${{ steps.worker.outputs.worker_url }}"

          cd infrastructure
          npx wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch=master >/dev/null 2>&1 || true
          PAGES_OUT=$(npx wrangler pages deploy ../.cloudflare-dist --project-name="$PAGES_PROJECT_NAME" --branch="$PAGES_BRANCH" --commit-dirty=true 2>&1)
          echo "$PAGES_OUT"
          PREVIEW_URL="https://${PAGES_BRANCH}.${PAGES_PROJECT_NAME}.pages.dev"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post / Update Sticky PR Preview Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview -->";
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const previewUrl = "${{ steps.pages.outputs.preview_url }}";
            const workerUrl = "${{ steps.worker.outputs.worker_url }}";
            const dbName = "${{ env.D1_DATABASE_NAME }}";

            const body = [
              marker,
              `### ⚡ Cloudflare Ephemeral PR Preview Ready (PR #${prNumber})`,
              "",
              "| Layer | Isolated Resource | Status |",
              "| :--- | :--- | :--- |",
              `| **Frontend (Cloudflare Pages)** | [${previewUrl}](${previewUrl}) | 🟢 Live (\`${sha}\`) |`,
              `| **API & WebSockets (Worker + DO)** | [\`${workerUrl}/api/health\`](${workerUrl}/api/health) | 🟢 Isolated \`BoardRoom\` |`,
              `| **Database (Cloudflare D1)** | \`${dbName}\` | 🟢 Seeded & Isolated |`,
              `| **AI Model (Zero Keys)** | Cloudflare Workers AI (\`@cf/meta/llama-3.3-70b-instruct-fp8-fast\`) | 🟢 Free Tier (No External Keys) |`,
              "",
              "_This environment is 100% isolated from production, has **zero external AI API keys injected**, uses only the free native Cloudflare Workers AI model, and will be **automatically torn down** when this PR is merged, closed or loses the `ci-full` label._"
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const stale of ["<!-- cloudflare-pr-preview-limit -->", "<!-- cloudflare-pr-preview-skipped -->"]) {
              for (const c of comments.filter(c => c.body && c.body.includes(stale))) {
                await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id });
              }
            }
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # One job: probe for this PR's preview D1 database first (a few seconds, no checkout, no npm install), exit early when there is none, otherwise tear down
  # the Worker, D1 database and Pages deployments and re-run a waiting PR. Runs on closed and on unlabeled ci-full; it does not look at label history.
  teardown-pr-preview:
    name: Tear Down Ephemeral PR Environment (closed or ci-full removed)
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' || (github.event.action == 'unlabeled' && github.event.label.name == 'ci-full'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      WORKER_NAME: leeroy-brain-pr-${{ github.event.pull_request.number }}
      D1_DATABASE_NAME: leeroy-board-db-pr-${{ github.event.pull_request.number }}
      PAGES_PROJECT_NAME: leeroy-board
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Look for this PR's preview D1 database
        id: probe
        run: |
          set -u
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ')
          ACC=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n ')
          ANSWER=unknown
          if [ -n "$TOKEN" ] && [ -n "$ACC" ]; then
            RES=$(curl -sS --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?name=$D1_DATABASE_NAME&per_page=100" -H "Authorization: Bearer $TOKEN" || true)
            ANSWER=$(node -e '
              try {
                const j = JSON.parse(process.argv[1]);
                if (j.success === true && Array.isArray(j.result)) process.stdout.write(j.result.some((d) => d.name === process.env.D1_DATABASE_NAME) ? "yes" : "no");
                else process.stdout.write("unknown");
              } catch (e) { process.stdout.write("unknown"); }
            ' "$RES")
          fi
          echo "Probe answer for $D1_DATABASE_NAME: $ANSWER"
          # Only a clear "no" ends the job early. "unknown" (missing secrets, API error) falls through to the full teardown, which is idempotent.
          if [ "$ANSWER" = "no" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No preview D1 database for PR $PR_NUMBER: nothing to tear down."
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.probe.outputs.exists == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        if: steps.probe.outputs.exists == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install Wrangler CLI
        if: steps.probe.outputs.exists == 'true'
        working-directory: infrastructure
        run: npm install --no-audit --no-fund

      - name: Delete Ephemeral Cloudflare Worker & Durable Object (`leeroy-brain-pr-*`)
        if: steps.probe.outputs.exists == 'true'
        working-directory: infrastructure
        run: |
          echo "Deleting ephemeral Worker '$WORKER_NAME'..."
          npx wrangler delete --name "$WORKER_NAME" --force || echo "Worker '$WORKER_NAME' already deleted or not found."

      - name: Delete Ephemeral Cloudflare D1 Database (`leeroy-board-db-pr-*`)
        if: steps.probe.outputs.exists == 'true'
        working-directory: infrastructure
        run: |
          echo "Deleting ephemeral D1 database '$D1_DATABASE_NAME'..."
          npx wrangler d1 delete "$D1_DATABASE_NAME" --skip-confirmation || echo "D1 '$D1_DATABASE_NAME' already deleted or not found."

      - name: Delete Cloudflare Pages Preview Deployments for `pr-*`
        if: steps.probe.outputs.exists == 'true'
        run: |
          node -e '
            (async () => {
              const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
              const token = process.env.CLOUDFLARE_API_TOKEN;
              const project = process.env.PAGES_PROJECT_NAME;
              const branch = process.env.PAGES_BRANCH;
              if (!accountId || !token) return;

              const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}/deployments`;
              const headers = { Authorization: `Bearer ${token}` };
              const res = await fetch(base, { headers });
              if (!res.ok) return;
              const data = await res.json();
              const matches = (data.result || []).filter(
                d => d.environment === "preview" && d.deployment_trigger?.metadata?.branch === branch
              );
              for (const d of matches) {
                console.log(`Deleting Pages preview deployment ${d.id} (branch=${branch})...`);
                await fetch(`${base}/${d.id}?force=true`, { method: "DELETE", headers });
              }
            })().catch(e => console.warn("Pages cleanup warning:", e));
          '

      - name: Update Sticky PR Comment to Confirm Teardown
        if: steps.probe.outputs.exists == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview -->";
            const prNumber = context.payload.pull_request.number;
            const merged = Boolean(context.payload.pull_request.merged);
            const why = context.payload.action === "unlabeled" ? "ci-full label removed" : merged ? "Merged" : "Closed";
            const body = [
              marker,
              `### 🧹 Cloudflare Ephemeral PR Preview Torn Down (PR #${prNumber} ${why})`,
              "",
              "- 🗑️ Deleted Worker & Durable Object: `leeroy-brain-pr-" + prNumber + "`",
              "- 🗑️ Deleted D1 SQLite Database: `leeroy-board-db-pr-" + prNumber + "`",
              "- 🗑️ Deleted Cloudflare Pages preview deployments for branch `pr-" + prNumber + "`"
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }

      # Was the separate job `retry-waiting-previews`: a slot was just freed, so re-run the failed jobs of one PR that hit the D1 limit.
      - name: Re-run failed preview and test jobs of a PR that hit the limit
        if: steps.probe.outputs.exists == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = "<!-- cloudflare-pr-preview-limit -->";
            const closed = context.payload.pull_request.number;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            // Oldest first; each re-run needs one slot, and a PR that still finds none just posts the notice again.
            prs.sort((a, b) => a.number - b.number);
            for (const pr of prs) {
              if (pr.number === closed || pr.head.repo.full_name !== `${owner}/${repo}`) continue;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              if (!comments.some(c => c.body && c.body.includes(marker) && c.body.includes(pr.head.sha.slice(0, 7)))) continue;
              for (const wf of ["pr-preview-cloudflare.yml", "preview-tests.yml"]) {
                const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: wf, event: "pull_request", head_sha: pr.head.sha, per_page: 5 });
                const run = data.workflow_runs.find(r => r.status === "completed" && r.conclusion === "failure");
                if (!run) continue;
                console.log(`Re-running failed jobs of ${wf} run ${run.id} for PR #${pr.number}`);
                await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
              }
              break; // one PR per freed slot
            }
