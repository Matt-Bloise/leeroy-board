name: PR Ephemeral Preview Environment (Cloudflare Free Tier)

# The preview exists only while the PR carries the label `ci-full` (the full suite takes runner time and a preview slot, docs/runbooks/ci-minutes.md):
#   opened / synchronize / reopened / labeled ci-full, with the label present -> prep, then deploy (spin up or refresh the preview)
#   closed, or unlabeled ci-full                                           -> teardown (one job; exits early when no preview D1 exists), frees a D1 slot
# A PR without the label costs nothing here: every job is skipped. Label events other than ci-full skip every job and never cancel a running spin-up.
# Teardown never depends on label history: it looks for the D1 database (or the Worker) of this PR number.
# Teardown PROVES deletion (tools/preview-cleanup.mjs): a delete that fails fails the job, all Pages pages are listed, and the job lists Worker, D1 and Pages again and fails if anything named for the PR remains.
# A teardown run is in its own concurrency group and is never cancelled; a spin-up run never cancels it and it never cancels a spin-up.
# A PR that changes only docs and data/library gets no preview even with ci-full (tools/docs-only.mjs light path; the visual gate reads the pinned tests/fixtures/library).
# A budget pre-flight (job budget-gate, tools/cf-budget-check.mjs, budget in .github/cf-budget.json) counts today's spin-ups through the GitHub API and REFUSES to start a spin-up when the daily budget is used up (fail closed;
# the only override is the label named in that file, for the session that merges).
# The game-facts smoke runs on a spin-up only when the loader, the lookup, the schema or the smoke changed (tools/smoke-scope.mjs), on a small sample (under 200 rows written, printed in the summary).

on:
  # Manual: tear down the preview of a pull request that is already CLOSED (a teardown that failed, or one that never ran). master only; see job teardown-closed-pr.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of a CLOSED pull request whose preview Worker, D1 database and Pages deployments to delete (only names derived from this number)"
        required: true
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - labeled
      - unlabeled

# Two groups per PR: `teardown` (closed, or unlabeled ci-full) and `spinup` (everything else). A teardown run is never cancelled (cancel-in-progress false for it, and no spin-up run can reach its
# group), so a push or a label right after the close cannot stop a delete half way; teardown runs of one PR queue behind each other. Within `spinup` the old rule stands: a real event cancels the older
# run, an unrelated label event (security, visual, ...) does not.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-manual-{1}', github.workflow, inputs.pr_number) || format('{0}-{1}-{2}', github.workflow, github.event.pull_request.number, (github.event.action == 'closed' || (github.event.action == 'unlabeled' && github.event.label.name == 'ci-full')) && 'teardown' || 'spinup') }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !(github.event.action == 'closed' || (github.event.action == 'unlabeled' && github.event.label.name == 'ci-full') || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-full')) }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # One cheap job for the three former tiny jobs: fork policy, path classification (docs-only PRs get no preview and no D1 database) and the docs-only note.
  # Same-repo PRs without `ci-full` skip it (0 minutes); fork PRs only run the policy step.
  prep:
    name: Fork policy and classify
    if: >-
      (github.event.pull_request.head.repo.full_name != github.repository && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.state == 'open' && contains(github.event.pull_request.labels.*.name, 'ci-full') &&
       (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'ci-full')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      smoke_needed: ${{ steps.classify.outputs.smoke_needed }}
    steps:
      - name: Enforce the fork PR policy
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          IS_FORK="false"
          [ "$HEAD_REPO" = "$BASE_REPO" ] || IS_FORK="true"
          echo "Head repository: $HEAD_REPO"
          echo "Base repository: $BASE_REPO"
          echo "Base branch: $BASE_BRANCH"
          echo "Is fork PR: $IS_FORK"
          if [ "$IS_FORK" = "true" ] && [ "$BASE_BRANCH" = "master" ]; then
            echo "::error::Fork pull requests cannot be merged directly into 'master'. Fork pull requests must target a non-master branch (e.g. an integration or feature branch)."
            exit 1
          fi

      - name: Checkout PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Classify the changed paths
        id: classify
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths.txt"
          # File names are attacker-controlled: prefix every line so none can start a workflow command (::...) in the log.
          sed 's/^/| /' "$RUNNER_TEMP/paths.txt"
          echo "docs_only=$(node tools/docs-only.mjs < "$RUNNER_TEMP/paths.txt")" >> "$GITHUB_OUTPUT"
          # The game-facts smoke writes rows to the real preview D1: it runs only when the loader, lookup, schema, a migration, the smoke or this workflow changed. An empty answer runs it.
          echo "smoke_needed=$(node tools/smoke-scope.mjs < "$RUNNER_TEMP/paths.txt")" >> "$GITHUB_OUTPUT"

      - name: Say that tests run without a preview
        if: steps.classify.outputs.docs_only == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview-skipped -->";
            const prNumber = context.payload.pull_request.number;
            const body = [marker, "### Cloudflare PR preview skipped (docs or library data only)", "",
              "This PR changes only documentation (`docs/**`, root `*.md` files, `.github/ISSUE_TEMPLATE/**`), library data (`data/library/*.json`, which the visual gate reads from a pinned copy) or files no preview run exercises, so no preview environment (and no D1 database) was created, even with `ci-full`. Preview Tests run the unit and stamps suites, and the visual baselines when a site file changed."].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });

  # Preview secrets are optional. This job only reads whether both exist and never uses them. If either is missing the preview jobs are skipped with a notice:
  # no failure. Previews use CLOUDFLARE_API_TOKEN by decision of the Cloudflare account owner (no second token); the preview admin token never falls back to a production secret.
  # See docs/runbooks/ci-secrets.md.
  preview-guard:
    name: Check preview secrets
    needs: prep
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.prep.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: none
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    env:
      PREVIEW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_ADMIN_TOKEN: ${{ secrets.BOARD_PREVIEW_ADMIN_TOKEN }}
      PREVIEW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check CLOUDFLARE_API_TOKEN, BOARD_PREVIEW_ADMIN_TOKEN and CLOUDFLARE_ACCOUNT_ID
        id: check
        run: |
          MISSING=""
          [ -n "$PREVIEW_API_TOKEN" ] || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "$PREVIEW_ADMIN_TOKEN" ] || MISSING="$MISSING BOARD_PREVIEW_ADMIN_TOKEN"
          [ -n "$PREVIEW_ACCOUNT_ID" ] || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview skipped::No preview was created because these repository secrets are missing:$MISSING. The preview admin token never falls back to a production secret. The Preview tests comment will say SKIPPED and is not the merge gate. See docs/runbooks/ci-secrets.md."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  # Refuses to start the spin-up when today's budget of preview spin-ups (.github/cf-budget.json) is used up. Read-only: it only reads run history from the GitHub API. Fails closed: when the count cannot
  # be made, the spin-up does not start. The override label is the only way past (see the file); the deploy job needs this job to succeed, so a refusal skips the spin-up and shows red here, with the reason.
  budget-gate:
    name: Cloudflare daily budget pre-flight (spin-up)
    needs: [prep, preview-guard]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.prep.outputs.docs_only != 'true' && needs.preview-guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Count today's spin-ups and refuse when the budget is used up
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/cf-budget-check.mjs spinup

  deploy-pr-preview:
    name: Spin Up Isolated PR Preview (Pages + Worker + D1 + DO)
    needs: [prep, preview-guard, budget-gate]
    # prep runs for same-repo PRs only with the label `ci-full` (and for forks, which never get a preview), so this is the single spin-up condition.
    # Missing preview secrets skip this job (preview-guard), they never fail it.
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.prep.outputs.docs_only != 'true' && needs.preview-guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      WORKER_NAME: leeroy-brain-pr-${{ github.event.pull_request.number }}
      D1_DATABASE_NAME: leeroy-board-db-pr-${{ github.event.pull_request.number }}
      PAGES_PROJECT_NAME: leeroy-board
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install Wrangler CLI
        working-directory: infrastructure
        run: npm ci --no-audit --no-fund

      - name: Verify Cloudflare Credentials & Scope Diagnostics
        working-directory: infrastructure
        run: |
          set -e
          echo "=== Cloudflare Credential & Account Pre-flight Check ==="

          # Sanitize whitespace / carriage returns / quotes
          CLEAN_TOKEN=$(echo "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ' | sed -e 's/^["\x27]//' -e 's/["\x27]$//')
          CLEAN_ACC=$(echo "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n ' | sed -e 's/^["\x27]//' -e 's/["\x27]$//')

          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or missing (previews share the production Cloudflare token by decision of the account owner; docs/runbooks/ci-secrets.md)."
            exit 1
          fi

          # 1. Verify token status against Cloudflare verify endpoint
          VERIFY_RES=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          TOKEN_STATUS=$(node -e 'try { const j = JSON.parse(process.argv[1]); console.log(j.result?.status || (j.success ? "active" : "failed")); } catch(e) { console.log("failed"); }' "$VERIFY_RES")

          if [ "$TOKEN_STATUS" != "active" ]; then
            echo "::error::Cloudflare API Token validation failed. Status: $TOKEN_STATUS"
            echo "Cloudflare error codes: $(printf '%s' "$VERIFY_RES" | node ../tools/cf-error-codes.mjs)"
            echo ""
            echo "Action Required:"
            echo "1. Verify CLOUDFLARE_API_TOKEN is a valid API Token (not a Global API Key)."
            echo "2. Check that the token is Active in Cloudflare Dashboard -> My Profile -> API Tokens."
            exit 1
          fi
          echo "✓ Cloudflare API Token is ACTIVE and verified."

          # 2. Check accounts the token has access to
          ACCOUNTS_RES=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          ACC_INFO=$(node -e '
            try {
              const j = JSON.parse(process.argv[1]);
              const accs = j.result || [];
              const target = process.env.TARGET_ID;
              const match = accs.find(a => a.id === target);
              if (match) {
                console.log("MATCH:" + match.id);
              } else if (accs.length === 1) {
                console.log("RESOLVED_SINGLE:" + accs[0].id);
              } else if (accs.length > 1) {
                console.log("MULTIPLE:" + accs.length);
              } else {
                console.log("NONE");
              }
            } catch(e) {
              console.log("PARSE_ERROR");
            }
          ' "$ACCOUNTS_RES")

          TARGET_ACCOUNT_ID="$CLEAN_ACC"
          if [[ "$ACC_INFO" == MATCH:* ]]; then
            ACC_ID=$(echo "$ACC_INFO" | cut -d: -f2)
            echo "::add-mask::$ACC_ID"
            echo "✓ Account ID matches the token (account name and id are not printed)."
          elif [[ "$ACC_INFO" == RESOLVED_SINGLE:* ]]; then
            ACC_ID=$(echo "$ACC_INFO" | cut -d: -f2)
            echo "::add-mask::$ACC_ID"
            echo "::notice::Auto-resolved the Cloudflare account from the token (account name and id are not printed)."
            TARGET_ACCOUNT_ID="$ACC_ID"
          elif [[ "$ACC_INFO" == MULTIPLE:* ]]; then
            echo "::error::Provided Account ID '$CLEAN_ACC' does not match any accounts this token can access."
            echo "The token can access more than one account; names and ids are not printed. Set CLOUDFLARE_ACCOUNT_ID to the intended one."
            exit 1
          else
            echo "::warning::Could not query /accounts via token. Proceeding with provided Account ID: $CLEAN_ACC"
          fi

          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$TARGET_ACCOUNT_ID" >> "$GITHUB_ENV"

          # 3. Test D1 permissions specifically
          D1_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$TARGET_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLEAN_TOKEN")
          D1_SUCCESS=$(node -e 'try { const j = JSON.parse(process.argv[1]); console.log(j.success ? "true" : "false"); } catch(e) { console.log("false"); }' "$D1_CHECK")

          if [ "$D1_SUCCESS" != "true" ]; then
            echo "::error::Token lacks D1 permissions for account '$TARGET_ACCOUNT_ID'."
            echo "Cloudflare error codes: $(printf '%s' "$D1_CHECK" | node ../tools/cf-error-codes.mjs)"
            echo ""
            echo "Action Required to Fix (Authentication error 10000 on D1):"
            echo "In Cloudflare Dashboard -> My Profile (top-right avatar) -> API Tokens:"
            echo "1. Edit the token used for CLOUDFLARE_API_TOKEN."
            echo "2. Under 'Permissions', click '+ Add more' and add: 'Account' -> 'D1' -> 'Edit'."
            echo "3. Also ensure 'Account' -> 'Cloudflare Pages' -> 'Edit' is present."
            echo "4. Save token and re-run workflow."
            exit 1
          fi
          echo "✓ Cloudflare D1 permissions verified."

      - name: Provision Ephemeral D1 Database & Configure PR `wrangler.toml`
        id: d1
        working-directory: infrastructure
        run: |
          set -e
          echo "Checking for ephemeral D1 database '$D1_DATABASE_NAME'..."
          LIST_JSON=$(npx wrangler d1 list --json)
          DB_ID=$(node -e '
            const list = JSON.parse(process.argv[1] || "[]");
            const found = list.find(d => d.name === process.env.D1_DATABASE_NAME);
            if (found) process.stdout.write(found.uuid);
          ' "$LIST_JSON")

          if [ -z "$DB_ID" ]; then
            echo "Creating ephemeral D1 database '$D1_DATABASE_NAME'..."
            set +e
            CREATE_OUT=$(npx wrangler d1 create "$D1_DATABASE_NAME" 2>&1)
            CREATE_EXIT=$?
            set -e
            echo "$CREATE_OUT"
            if [ $CREATE_EXIT -ne 0 ]; then
              # 7406 = "System limit reached: databases per account (10)". See docs/runbooks/preview-d1-limit.md.
              if echo "$CREATE_OUT" | grep -qE '(^|[^0-9])7406([^0-9]|$)'; then
                echo "limit_reached=true" >> "$GITHUB_OUTPUT"
                echo "::error::Preview limit reached (D1 error 7406); a slot must free up before this PR gets a preview."
              fi
              exit $CREATE_EXIT
            fi
            DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' | head -n 1)
          fi

          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not resolve ephemeral D1 database_id"
            exit 1
          fi

          # Patch wrangler.toml with PR-specific Worker name, D1 name/ID, set AI_PROVIDER="workers-ai",
          # mark IS_PR_PREVIEW="true", add PR Pages preview to ALLOWED_ORIGINS, and remove [triggers]
          # so PR previews do not consume the 5-Cron-Trigger Free-Tier account limit.
          node -e '
            const fs = require("fs");
            let toml = fs.readFileSync("wrangler.toml", "utf8");
            toml = toml.replace(/^name\s*=\s*".*"/m, `name = "${process.env.WORKER_NAME}"`);
            toml = toml.replace(/database_name\s*=\s*".*"/, `database_name = "${process.env.D1_DATABASE_NAME}"`);
            toml = toml.replace(/database_id\s*=\s*".*"/, `database_id = "${process.argv[1]}"`);
            toml = toml.replace(/routes\s*=\s*\[[\s\S]*?\]\r?\n?/, "");
            toml = toml.replace(/\[triggers\][\s\S]*?crons\s*=\s*\[[^\]]*\]\r?\n?/, "");
            toml = toml.replace(/AI_PROVIDER\s*=\s*".*"/, `AI_PROVIDER = "workers-ai"`);
            // Observability (100 percent log sampling) is for production only: a preview Worker logs nothing. Fails the step if the block is not in the expected shape, so a layout change cannot silently turn it back on.
            const obs = toml.replace(/\[observability\]\s*\r?\nenabled\s*=\s*true\s*\r?\nhead_sampling_rate\s*=\s*1\s*\r?\n/, "[observability]\nenabled = false\n");
            if (obs === toml || !/\[observability\]\s*\nenabled = false/.test(obs)) { console.error("::error::wrangler.toml [observability] is not in the expected shape; the preview cannot turn log sampling off."); process.exit(1); }
            toml = obs;
            const prOrigin = `https://${process.env.PAGES_BRANCH}.${process.env.PAGES_PROJECT_NAME}.pages.dev`;
            toml = toml.replace(/ALLOWED_ORIGINS\s*=\s*"([^"]*)"/, (m, orig) => `ALLOWED_ORIGINS = "${orig},${prOrigin}"`);
            toml = toml.replace(/BOARD_PUBLIC_URL\s*=\s*".*"/, `BOARD_PUBLIC_URL = "${prOrigin}"`);
            if (process.env.CLOUDFLARE_ACCOUNT_ID) {
              toml = toml.replace(/CLOUDFLARE_ACCOUNT_ID = ""/, `CLOUDFLARE_ACCOUNT_ID = "${process.env.CLOUDFLARE_ACCOUNT_ID}"`);
            }
            if (!toml.includes("IS_PR_PREVIEW")) {
              toml = toml.replace(/^\[vars\]/m, `[vars]\nIS_PR_PREVIEW = "true"\nWORKER_NAME = "${process.env.WORKER_NAME}"`);
            }
            fs.writeFileSync("wrangler.toml", toml, "utf8");
          ' "$DB_ID"

          # A preview must never bind to the PRODUCTION feature-flag app: remove that binding block from wrangler.toml (previews then read the legacy [vars]).
          # The tool fails the step if any such binding is left.
          node ../tools/strip-flagship-binding.mjs wrangler.toml

          # A preview must not be able to call Workers AI either (the account's 10,000 neurons a day; the steward's rule 6): remove the [ai] binding. The Worker code also answers a placeholder in a
          # preview without reading env.AI (worker/ai-models.js workersAiRun). The tool fails the step if the binding cannot be removed or was not there.
          node ../tools/strip-ai-binding.mjs wrangler.toml

      - name: Say that the preview limit is reached
        if: failure() && steps.d1.outputs.limit_reached == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview-limit -->";
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [marker, `### Preview limit reached (\`${sha}\`)`, "",
              "Preview limit reached; will retry when a slot frees.",
              "", "The Cloudflare Free plan allows 10 D1 databases per account and every open PR uses one (error 7406). When another PR is merged, closed or loses its `ci-full` label, its slot is released and this PR's failed preview and test jobs are re-run automatically. See `docs/runbooks/preview-d1-limit.md`."].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });

      - name: Apply Unified D1 Schema (`schema.sql`), Migrations & Seed Ephemeral Database
        working-directory: infrastructure
        run: |
          set -e
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=./schema.sql
          if [ -d "migrations" ] && [ -n "$(find migrations -maxdepth 1 -name '*.sql' 2>/dev/null)" ]; then
            echo "Applying numbered migrations..."
            npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote
          else
            echo "Initial database deployment: unified schema.sql applied with zero migrations."
          fi

          COUNT_JSON=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command="SELECT COUNT(*) AS n FROM kv_state;" --json)
          # Fail closed: an unexpected output shape must stop the deploy, never read as 0 rows (that would seed over live kv_state).
          ROW_COUNT=$(node ../tools/d1-row-count.mjs "$COUNT_JSON") || { echo "::error::Could not read the kv_state row count from wrangler. Nothing was seeded."; exit 1; }

          if [ "$ROW_COUNT" = "0" ]; then
            echo "Seeding ephemeral PR D1 database '$D1_DATABASE_NAME'..."
            D1_DATABASE_NAME="$D1_DATABASE_NAME" node ./scripts/seed-d1.mjs --remote
          fi

      - name: Game-facts smoke skipped (nothing it exercises changed)
        if: needs.prep.outputs.smoke_needed == 'false'
        run: |
          echo "::notice title=Game-facts smoke skipped::No changed file is the game-facts loader, lookup, schema, a migration, the smoke or this workflow (tools/smoke-scope.mjs). It would have written about 180 D1 rows (3,700 before the small profile)."
          echo "### Game facts smoke skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "No changed file is the loader, lookup, schema, a migration, the smoke or this workflow, so the smoke did not run and wrote 0 D1 rows." >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the game_facts store on the real preview D1 (lookups, rows written, plain export)
        if: needs.prep.outputs.smoke_needed != 'false'
        # PREVIEW DATABASE ONLY: tools/d1-facts-smoke.mjs refuses any name that is not leeroy-board-db-pr-<number> (the production name leeroy-board-db included) before it calls wrangler.
        # It inserts fictional rows, runs the Worker's own lookup against the real D1, loads a few dozen fictional facts (the small profile: under 200 rows written in all, printed in the summary) with the loader's own statements and reads meta.rows_written, then runs a plain
        # `wrangler d1 export --remote` and the restore drill. A failed assertion, including a failed export, FAILS this step. Results go to the job summary.
        working-directory: infrastructure
        run: node ../tools/d1-facts-smoke.mjs smoke
      - name: Deploy Ephemeral PR Worker & Durable Object (Single Deploy)
        id: worker
        working-directory: infrastructure
        run: |
          set +e
          # The production BOARD_ADMIN_TOKEN is never passed to the preview (a --var is plain text in the Worker settings).
          # The preview gets a derived admin secret in the next step.
          # Bounded retry (at most 3 attempts, 20 s apart) for ONE known transient: Cloudflare error 10007 on the first deploy of a brand-new PR Worker. Any other failure stops at once.
          for ATTEMPT in 1 2 3; do
            DEPLOY_OUT=$(npx wrangler deploy 2>&1)
            DEPLOY_EXIT=$?
            if [ $DEPLOY_EXIT -eq 0 ] || ! printf '%s' "$DEPLOY_OUT" | grep -qE '(^|[^0-9])10007([^0-9]|$)' || [ $ATTEMPT -eq 3 ]; then break; fi
            echo "::warning::wrangler deploy hit Cloudflare error 10007 (attempt $ATTEMPT of 3); retrying in 20 s"
            sleep 20
          done
          # The account workers.dev subdomain carries a personal name: it is never printed. The raw output stays in the variable, only the redacted text reaches the log.
          SUB=$(printf '%s' "$DEPLOY_OUT" | grep -oE '\.[a-z0-9-]+\.workers\.dev' | head -n 1 | sed -E 's#^\.([a-z0-9-]+)\.workers\.dev$#\1#' || true)
          if printf '%s' "$SUB" | grep -qE '^[a-z0-9-]+$'; then echo "::add-mask::$SUB"; fi
          echo "$DEPLOY_OUT" | sed -E 's#\.[a-z0-9-]+\.workers\.dev#.<account-subdomain>.workers.dev#g'
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::wrangler deploy failed with exit code $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi
          set -e
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oE "https://${WORKER_NAME}\.[a-z0-9-]+\.workers\.dev" | head -n 1)
          if [ -z "$WORKER_URL" ]; then
            # The old wrangler 3 command for the account subdomain does not exist in wrangler 4, and a guessed URL would point the preview tests at the wrong Worker. Fail loudly instead.
            echo "::error::Could not read the preview Worker URL (https://${WORKER_NAME}.<subdomain>.workers.dev) from the wrangler deploy output above. Not guessing one."
            exit 1
          fi
          # Mask the account subdomain (it carries a personal name) for the rest of THIS job. The step output below is read only by later steps of this job; no other job or workflow receives the host (each job that needs it resolves it itself: tools/preview-worker-url.sh).
          SUB=$(printf '%s' "$WORKER_URL" | sed -E 's#^https://[^.]+\.([a-z0-9-]+)\.workers\.dev$#\1#')
          if printf '%s' "$SUB" | grep -qE '^[a-z0-9-]+$'; then echo "::add-mask::$SUB"; echo "::add-mask::$WORKER_URL"; fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Set Preview Salt Secrets (derived per preview)
        working-directory: infrastructure
        env:
          PREVIEW_BASE: ${{ secrets.BOARD_PREVIEW_ADMIN_TOKEN }}
        run: |
          set -e
          # Every value is derived from the preview-only secret BOARD_PREVIEW_ADMIN_TOKEN, never from a production secret (USER_SALT, KEY_SALT and BOARD_ADMIN_TOKEN
          # are production secrets in the GitHub environment `production`; a PR run cannot read them). The api tests derive BOARD_ADMIN_TOKEN the same way.
          # Each preview gets its own values: HMAC-SHA256 of the Worker name keyed by BOARD_PREVIEW_ADMIN_TOKEN. They differ per preview and the base is never copied.
          if [ -z "$PREVIEW_BASE" ]; then
            echo "::error::BOARD_PREVIEW_ADMIN_TOKEN is missing. The preview-guard job should have skipped this job; refusing to continue, and there is no fallback to a production secret."
            exit 1
          fi
          for SECRET_NAME in USER_SALT KEY_SALT BOARD_ADMIN_TOKEN; do
            BASE="$PREVIEW_BASE"
            DERIVED=$(printf '%s' "preview:$SECRET_NAME:$WORKER_NAME" | openssl dgst -sha256 -hmac "$BASE" -r | cut -d' ' -f1)
            echo "::add-mask::$DERIVED"
            printf '%s' "$DERIVED" | npx wrangler secret put "$SECRET_NAME" >/dev/null
            echo "Set $SECRET_NAME on $WORKER_NAME (derived, value not shown)."
          done

      - name: Stage Static Site (Wired to PR Worker) & Deploy to Cloudflare Pages Preview
        id: pages
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        run: |
          set -e
          # The bundle is staged by tools/pages-bundle.mjs (shared by the production deploy and the PR preview). It leaves out the member data files
          # (the Worker serves those through its privacy projection) and fails this step when one is present. docs/runbooks/member-data-worker-only.md
          node tools/pages-bundle.mjs .cloudflare-dist

          # The Worker URL is stamped into JavaScript: accept only https://<name>[.<subdomain>].workers.dev, refuse anything else.
          if ! printf '%s' "$WORKER_URL" | grep -qE '^https://[a-z0-9-]+(\.[a-z0-9-]+)?\.workers\.dev$'; then
            echo "::error::The Worker URL does not have the shape https://<name>[.<subdomain>].workers.dev; refusing to stamp it into the site bundle."
            exit 1
          fi
          # Stamp the exact PR Worker URL into the STAGED copy only (.cloudflare-dist): js/brain.js (WORKER), js/board.js (PREVIEW_WORKER) and the connect-src of the CSP lines in _headers (tools/preview-stamp.mjs).
          # The production sources carry no workers.dev host at all; both the branch alias URL and the per-commit hash URL talk directly to this PR's isolated Worker + D1.
          node tools/preview-stamp.mjs .cloudflare-dist "$WORKER_URL"

          cd infrastructure
          npx wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch=master >/dev/null 2>&1 || true
          PAGES_OUT=$(npx wrangler pages deploy ../.cloudflare-dist --project-name="$PAGES_PROJECT_NAME" --branch="$PAGES_BRANCH" --commit-dirty=true 2>&1)
          echo "$PAGES_OUT"
          PREVIEW_URL="https://${PAGES_BRANCH}.${PAGES_PROJECT_NAME}.pages.dev"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post / Update Sticky PR Preview Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview -->";
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const previewUrl = "${{ steps.pages.outputs.preview_url }}";
            const workerName = "${{ env.WORKER_NAME }}"; // the host (the account's workers.dev subdomain) is NOT printed: it carries a personal name
            const dbName = "${{ env.D1_DATABASE_NAME }}";

            const body = [
              marker,
              `### ⚡ Cloudflare Ephemeral PR Preview Ready (PR #${prNumber})`,
              "",
              "| Layer | Isolated Resource | Status |",
              "| :--- | :--- | :--- |",
              `| **Frontend (Cloudflare Pages)** | [${previewUrl}](${previewUrl}) | 🟢 Live (\`${sha}\`) |`,
              `| **API & WebSockets (Worker + DO)** | \`${workerName}\` on the account's workers.dev host (host not printed here) | 🟢 Isolated \`BoardRoom\` |`,
              `| **Database (Cloudflare D1)** | \`${dbName}\` | 🟢 Seeded & Isolated |`,
              `| **AI Model** | None: Workers AI is switched off in previews (placeholder answers, no model is called) | 🟢 No keys, no AI spend |`,
              "",
              "_Own Worker, D1 database and Pages deployment, separate from production: no production data or secrets, no external AI API keys, and it cannot call Workers AI (it answers a placeholder). It shares the account's Free-plan limits. It is torn down, and the deletion checked, when this PR is merged, closed or loses the `ci-full` label._"
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const stale of ["<!-- cloudflare-pr-preview-limit -->", "<!-- cloudflare-pr-preview-skipped -->"]) {
              for (const c of comments.filter(c => c.body && c.body.includes(stale))) {
                await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id });
              }
            }
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # One job: probe for this PR's preview D1 database first (a few seconds, no checkout, no npm install), exit early when there is none, otherwise tear down
  # the Worker, D1 database and Pages deployments and re-run a waiting PR. Runs on closed and on unlabeled ci-full; it does not look at label history.
  # Manual teardown of ONE closed pull request's preview, started by hand (workflow_dispatch, input pr_number). The tool (tools/preview-cleanup.mjs teardown-closed) refuses a value that is not a number, a
  # number that is no pull request, and an open pull request; it deletes only the three names derived from that number and then proves they are gone (same code as the closed event). Runs from master only, so
  # a branch cannot run altered code with the Cloudflare secrets. The number goes in through the environment, never into the script text.
  teardown-closed-pr:
    name: Tear down a closed PR's preview by number (manual)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT_NAME: leeroy-board
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Check the pull request is closed, delete its preview and verify it is gone
        run: node tools/preview-cleanup.mjs teardown-closed "$PR_NUMBER"

  teardown-pr-preview:
    name: Tear Down Ephemeral PR Environment (closed or ci-full removed)
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' || (github.event.action == 'unlabeled' && github.event.label.name == 'ci-full'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      WORKER_NAME: leeroy-brain-pr-${{ github.event.pull_request.number }}
      D1_DATABASE_NAME: leeroy-board-db-pr-${{ github.event.pull_request.number }}
      PAGES_PROJECT_NAME: leeroy-board
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}

    steps:
      # A spin-up of this PR that is still running is in the other concurrency group (so that nothing can cancel a teardown). Stop it first and wait for it to end, so it cannot create the Worker, the D1
      # database or the Pages deployment after this job has deleted and verified them. What it already created is then torn down below. Cancelling needs actions: write (granted to this job).
      - name: Stop this PR's spin-up runs that are still running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          RUNS() { gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pr-preview-cloudflare.yml/runs?status=$1&per_page=100" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and ((.pull_requests // []) | map(.number) | index($PR_NUMBER))) | .id" 2>/dev/null || true; }
          IDS=$( { RUNS in_progress; RUNS queued; } | sort -u )
          if [ -z "$IDS" ]; then echo "No other run of the preview workflow for PR $PR_NUMBER is running."; exit 0; fi
          for ID in $IDS; do echo "Cancelling run $ID (a spin-up of PR $PR_NUMBER still running)"; gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$ID/cancel" >/dev/null 2>&1 || true; done
          for I in $(seq 1 24); do
            LEFT=$( { RUNS in_progress; RUNS queued; } | sort -u | wc -l | tr -d ' ')
            [ "$LEFT" = "0" ] && { echo "The spin-up run(s) ended."; exit 0; }
            echo "Waiting for $LEFT cancelled run(s) to end ($I/24)"; sleep 10
          done
          echo "::warning::A spin-up run of PR $PR_NUMBER had not ended after 4 minutes; tearing down anyway. The daily leak report shows anything it creates afterwards."

      - name: Look for this PR's preview resources
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ')
          ACC=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n ')
          ANSWER=unknown
          if [ -z "$TOKEN" ] || [ -z "$ACC" ]; then
            # No preview token (or account id): no preview could have been created by this workflow, and the production token is never used here. Skip, do not fail.
            ANSWER=no
            echo "::notice title=Teardown skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing, so there is no preview to tear down. See docs/runbooks/ci-secrets.md."
          else
            D1=$(curl -sS --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?name=$D1_DATABASE_NAME&per_page=100" -H "Authorization: Bearer $TOKEN" || true)
            WK=$(curl -sS --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts" -H "Authorization: Bearer $TOKEN" || true)
            ANSWER=$(D1_JSON="$D1" WK_JSON="$WK" node -e '
              try {
                const d = JSON.parse(process.env.D1_JSON), w = JSON.parse(process.env.WK_JSON);
                if (d.success !== true || !Array.isArray(d.result) || w.success !== true || !Array.isArray(w.result)) { process.stdout.write("unknown"); process.exit(0); }
                const any = d.result.some((x) => x.name === process.env.D1_DATABASE_NAME) || w.result.some((x) => x.id === process.env.WORKER_NAME);
                process.stdout.write(any ? "yes" : "no");
              } catch (e) { process.stdout.write("unknown"); }
            ')
          fi
          # A PR that ever had a preview carries the sticky preview comment: its Pages deployments have no cheap probe, so such a PR always gets the full (idempotent) teardown, which lists and verifies all three.
          if [ "$ANSWER" = "no" ] && [ -n "$TOKEN" ]; then
            OUT=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '[.[] | select(.body | contains("<!-- cloudflare-pr-preview -->"))] | length' 2>/dev/null) || OUT=""
            if [ -z "$OUT" ]; then HAD=unknown; else HAD=$(echo "$OUT" | awk '{s+=$1} END{print s+0}'); fi
            if [ "$HAD" != "0" ]; then ANSWER=yes; echo "PR $PR_NUMBER has (or may have) had a preview: running the full teardown to verify all three resources are gone."; fi
          fi
          echo "Probe answer for PR $PR_NUMBER (D1 $D1_DATABASE_NAME or Worker $WORKER_NAME): $ANSWER"
          # Only a clear "no" ends the job early. "unknown" (API error) falls through to the full teardown, which is idempotent. Pages-only leftovers are the leak report's job.
          if [ "$ANSWER" = "no" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No preview D1 database or Worker for PR $PR_NUMBER: nothing to tear down."
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.probe.outputs.exists == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        if: steps.probe.outputs.exists == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      # Deletes the Worker (with its Durable Object), the D1 database and every Pages preview deployment of branch pr-<n>, then lists all three again (all pages) and FAILS if anything named for
      # this PR remains. A delete that fails fails this step (no echo-and-continue). Idempotent: a re-run of the job finishes what a failed run left. It never touches a name that is not derived from the PR number.
      - name: Delete the preview Worker, D1 database and Pages deployments, and verify they are gone
        if: steps.probe.outputs.exists == 'true'
        run: node tools/preview-cleanup.mjs teardown "$PR_NUMBER"

      - name: Update Sticky PR Comment to Confirm Teardown
        if: steps.probe.outputs.exists == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview -->";
            const prNumber = context.payload.pull_request.number;
            const merged = Boolean(context.payload.pull_request.merged);
            const why = context.payload.action === "unlabeled" ? "ci-full label removed" : merged ? "Merged" : "Closed";
            const body = [
              marker,
              `### 🧹 Cloudflare Ephemeral PR Preview Torn Down (PR #${prNumber} ${why})`,
              "",
              "- 🗑️ Deleted Worker & Durable Object: `leeroy-brain-pr-" + prNumber + "`",
              "- 🗑️ Deleted D1 SQLite Database: `leeroy-board-db-pr-" + prNumber + "`",
              "- 🗑️ Deleted Cloudflare Pages preview deployments for branch `pr-" + prNumber + "`"
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }

      # Was the separate job `retry-waiting-previews`: a slot was just freed, so re-run the failed jobs of one PR that hit the D1 limit.
      - name: Re-run failed preview and test jobs of a PR that hit the limit
        # Not tied to the tool's result: the D1 slot is freed as soon as the database is deleted, and a PR waiting for one should not wait for a Pages listing to verify.
        if: ${{ !cancelled() && steps.probe.outputs.exists == 'true' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = "<!-- cloudflare-pr-preview-limit -->";
            const closed = context.payload.pull_request.number;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            // Oldest first; each re-run needs one slot, and a PR that still finds none just posts the notice again.
            prs.sort((a, b) => a.number - b.number);
            for (const pr of prs) {
              if (pr.number === closed || pr.head.repo.full_name !== `${owner}/${repo}`) continue;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              if (!comments.some(c => c.body && c.body.includes(marker) && c.body.includes(pr.head.sha.slice(0, 7)))) continue;
              for (const wf of ["pr-preview-cloudflare.yml", "preview-tests.yml"]) {
                const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: wf, event: "pull_request", head_sha: pr.head.sha, per_page: 5 });
                const run = data.workflow_runs.find(r => r.status === "completed" && r.conclusion === "failure");
                if (!run) continue;
                console.log(`Re-running failed jobs of ${wf} run ${run.id} for PR #${pr.number}`);
                await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
              }
              break; // one PR per freed slot
            }
