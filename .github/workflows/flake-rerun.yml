name: Flake Rerun

# One automatic rerun of a failed Preview Tests run, only when EVERY failure line in the failed jobs matches a known harness-timing signature (tools/flake-signatures.json).
# Runs only for a first attempt, only for a run of this repository (never a fork), and reruns at most once: the rerun is attempt 2, which this workflow skips.
# Any unknown failure line, or a failed job with no failure line, means no rerun. It posts nothing; the decision is in this run's log.
# workflow_run workflows execute from the default branch, and this one checks out the default branch, never the pull request code.

on:
  workflow_run:
    workflows: ["Preview Tests"]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

env:
  # Pinned action SHAs (tag in the comment on each use):
  #   actions/checkout    11bd71901bbe5b1630ceea73d27597364c9af683 v4.2.2
  #   actions/setup-node  39370e3970a6d050c480ffad4ff0ed4d3fdee5af v4.1.0
  RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  rerun:
    name: rerun
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Decide from the failed jobs' logs
        id: decide
        run: |
          set -u -o pipefail
          mkdir -p "$RUNNER_TEMP/joblogs"
          # The report job only repeats what the others failed with, so it is not read. Any other failed job counts.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/1/jobs" --jq '.jobs[] | select(.conclusion == "failure" and .name != "report") | "\(.id)\t\(.name)"' > "$RUNNER_TEMP/failed.tsv"
          cat "$RUNNER_TEMP/failed.tsv"
          if [ ! -s "$RUNNER_TEMP/failed.tsv" ]; then echo "No failed job besides report: no rerun."; echo "rerun=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          while IFS=$'\t' read -r JOB_ID JOB_NAME; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > "$RUNNER_TEMP/joblogs/$JOB_ID.log" || echo "" > "$RUNNER_TEMP/joblogs/$JOB_ID.log"
          done < "$RUNNER_TEMP/failed.tsv"
          # Exit 0 = every failure line is a known signature, 10 = at least one is unknown or there is none.
          set +e
          node tools/flake-signatures.mjs "$RUNNER_TEMP"/joblogs/*.log
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then echo "rerun=true" >> "$GITHUB_OUTPUT"; else echo "rerun=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rerun the failed jobs once
        if: steps.decide.outputs.rerun == 'true'
        run: |
          set -eu
          echo "Known flake signatures only: rerunning the failed jobs of run $RUN_ID (attempt 1) once."
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
