name: Preview Tests

# Runs on draft and ready PRs from branches of this repository (not forks).
# Jobs: scope -> preview -> api, browser; unit and stamps run at once; report posts the sticky comment.
# A PR that changes only docs (tools/docs-only.mjs) gets no preview, so only unit and stamps run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Pinned action SHAs (tag in the comment on each use):
  #   actions/checkout          11bd71901bbe5b1630ceea73d27597364c9af683 v4.2.2
  #   actions/setup-node        39370e3970a6d050c480ffad4ff0ed4d3fdee5af v4.1.0
  #   actions/upload-artifact   b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 v4.4.3
  #   actions/github-script     60a0d83039c74a4aee543508d2ffcb1c3799cdea v7.0.1
  #   actions/download-artifact fa0a91b85d4f404e444e00e005971372dc801d16 v4.1.8
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  scope:
    name: scope
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths.txt"
          cat "$RUNNER_TEMP/paths.txt"
          echo "docs_only=$(node tools/docs-only.mjs < "$RUNNER_TEMP/paths.txt")" >> "$GITHUB_OUTPUT"

  unit:
    name: unit
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Unit tests
        run: |
          set -o pipefail
          node --test "tests/unit/*.test.mjs" 2>&1 | tee "$RUNNER_TEMP/unit.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: preview-test-logs-unit
          path: ${{ runner.temp }}/unit.log
          if-no-files-found: ignore

  stamps:
    name: stamps
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Stamps check
        run: |
          set -o pipefail
          node tools/stamps.mjs --check 2>&1 | tee "$RUNNER_TEMP/stamps.log"

      - name: Legal pages check
        run: node tools/render-legal.mjs --check

  preview:
    name: preview
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      pages: ${{ steps.urls.outputs.pages }}
      worker: ${{ steps.urls.outputs.worker }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the preview URLs in the PR comment
        id: urls
        run: |
          set -u
          SHORT="${HEAD_SHA:0:7}"
          for i in $(seq 1 48); do
            BODY=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[] | select(.body | contains("<!-- cloudflare-pr-preview -->"))] | last | .body // ""' || true)
            # The comment is updated in place; accept it only once it names this commit and is not the teardown notice.
            if echo "$BODY" | grep -q "$SHORT" && ! echo "$BODY" | grep -q "Torn Down"; then
              PAGES=$(echo "$BODY" | grep -oE "https://pr-${PR_NUMBER}\.leeroy-board\.pages\.dev" | head -n 1 || true)
              WORKER=$(echo "$BODY" | grep -oE "https://leeroy-brain-pr-${PR_NUMBER}\.[a-z0-9-]+\.workers\.dev" | head -n 1 || true)
              if [ -n "$PAGES" ] && [ -n "$WORKER" ]; then
                echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
                echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
                echo "Preview found: $PAGES and $WORKER (commit $SHORT)"
                exit 0
              fi
            fi
            echo "Attempt $i/48: preview comment for $SHORT not ready, waiting 15 s"
            sleep 15
          done
          echo "::error::No preview comment for commit $SHORT within 12 minutes."
          exit 1

      - name: Wait for the preview to answer
        env:
          WORKER_URL: ${{ steps.urls.outputs.worker }}
          PAGES_URL: ${{ steps.urls.outputs.pages }}
        run: |
          set -u
          for i in $(seq 1 40); do
            H=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/api/health" || echo 000)
            P=$(curl -s -o /dev/null -w "%{http_code}" "$PAGES_URL/" || echo 000)
            echo "Attempt $i/40: worker health $H, pages $P"
            if [ "$H" = "200" ] && [ "$P" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::Preview did not answer 200 in time."
          exit 1

  api:
    name: api
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: API tests
        working-directory: tests
        env:
          PREVIEW_API: ${{ needs.preview.outputs.worker }}
          PREVIEW_PAGES: ${{ needs.preview.outputs.pages }}
          BOARD_ADMIN_TOKEN: ${{ secrets.BOARD_ADMIN_TOKEN }}
        run: |
          set -o pipefail
          npm run test:api 2>&1 | tee "$RUNNER_TEMP/api.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: preview-test-logs-api
          path: ${{ runner.temp }}/api.log
          if-no-files-found: ignore

  browser:
    name: browser
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests
        run: |
          sudo apt-get update
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Browser smoke
        working-directory: tests
        env:
          PREVIEW_API: ${{ needs.preview.outputs.worker }}
          SMOKE_ALLOW_WEBKIT_NO_WEBGL: "1"
          PAGES_URL: ${{ needs.preview.outputs.pages }}
        run: |
          set -o pipefail
          npm run test:browser -- --url "$PAGES_URL/" 2>&1 | tee "$RUNNER_TEMP/browser.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: preview-test-logs-browser
          path: ${{ runner.temp }}/browser.log
          if-no-files-found: ignore

  visual-audit:
    # Non-gating: measures image sizes, overflow, contrast, layout shift and more. Not in the report's needs,
    # so it never changes the pass or fail result. Only runs for PRs labelled `visual`.
    name: visual-audit
    needs: preview
    if: contains(github.event.pull_request.labels.*.name, 'visual')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests
        run: |
          sudo apt-get update
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Visual audit
        working-directory: tests
        env:
          PREVIEW_PAGES: ${{ needs.preview.outputs.pages }}
          AUDIT_BUDGET_MIN: "10"
          AUDIT_OUT: visual-audit
        run: |
          node visual/audit.mjs 2>&1 | tee "$RUNNER_TEMP/visual-audit.log" || true

      - name: Upload the visual audit
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: visual-audit
          path: tests/visual-audit
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: report
    needs: [scope, unit, stamps, preview, api, browser]
    # Not on cancel: a newer push cancels this run and its own run posts the result for the newer commit.
    if: always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the logs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: preview-test-logs-*
          path: ${{ runner.temp }}/logs
          merge-multiple: true

      - name: Post or update the result comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          UNIT_OUTCOME: ${{ needs.unit.result }}
          STAMPS_OUTCOME: ${{ needs.stamps.result }}
          API_OUTCOME: ${{ needs.api.result }}
          BROWSER_OUTCOME: ${{ needs.browser.result }}
          PAGES_URL: ${{ needs.preview.outputs.pages }}
        with:
          script: |
            const fs = require("fs");
            const read = (f) => { try { return fs.readFileSync(`${process.env.RUNNER_TEMP}/logs/${f}`, "utf8"); } catch (e) { return ""; } };
            const unit = read("unit.log"), api = read("api.log"), br = read("browser.log");
            const num = (re, s) => { const m = s.match(re); return m ? Number(m[1]) : null; };
            // node:test summary lines read "<symbol> pass N" and "<symbol> fail N"
            const uPass = num(/^\S+ pass (\d+)$/m, unit), uFail = num(/^\S+ fail (\d+)$/m, unit);
            const aPass = num(/^\S+ pass (\d+)$/m, api), aFail = num(/^\S+ fail (\d+)$/m, api);
            let bPass = num(/live-smoke: all (\d+) checks passed/, br), bFail = bPass === null ? null : 0;
            const bf = br.match(/live-smoke: (\d+) of (\d+) checks FAILED/);
            if (bf) { bFail = Number(bf[1]); bPass = Number(bf[2]) - bFail; }
            const docsOnly = process.env.DOCS_ONLY === "true";
            const label = (outcome) => (outcome === "success" ? "pass" : outcome === "skipped" ? (docsOnly ? "not run (docs only)" : "not run") : "FAIL");
            const cell = (v) => (v === null ? "-" : String(v));
            const failing = br.split("\n").filter((l) => l.startsWith("FAIL ")).slice(0, 10);
            const apiFailing = api.split("\n").filter((l) => /^\S+ .* \(\d/.test(l) && !/^\S*✔/.test(l) && /fail|✖/i.test(l)).slice(0, 10);
            const lines = [...apiFailing, ...failing];
            const ok = process.env.UNIT_OUTCOME === "success" && process.env.STAMPS_OUTCOME === "success" &&
              (docsOnly || (process.env.API_OUTCOME === "success" && process.env.BROWSER_OUTCOME === "success"));
            const pr = context.payload.pull_request;
            const sha = pr.head.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "<!-- preview-tests -->",
              `### Preview tests: ${ok ? "passed" : "FAILED"} (\`${sha}\`)`,
              "",
              ok && docsOnly ? "**passed (docs only)**: this PR changes only docs, so no preview was created and only the unit and stamps suites ran.\n" : "",
              "| Suite | Result | Passed | Failed |",
              "| :--- | :--- | ---: | ---: |",
              `| Unit | ${label(process.env.UNIT_OUTCOME)} | ${cell(uPass)} | ${cell(uFail)} |`,
              `| Stamps | ${label(process.env.STAMPS_OUTCOME)} | - | - |`,
              `| API | ${label(process.env.API_OUTCOME)} | ${cell(aPass)} | ${cell(aFail)} |`,
              `| Browser smoke (Chromium + WebKit) | ${label(process.env.BROWSER_OUTCOME)} | ${cell(bPass)} | ${cell(bFail)} |`,
              "",
              docsOnly ? "No preview (docs only)." : process.env.PAGES_URL ? `Preview: ${process.env.PAGES_URL}` : "No preview URL was found.",
              lines.length ? "\nFirst failures:\n```\n" + lines.join("\n").slice(0, 1500) + "\n```" : "",
              pr.labels.some((l) => l.name === "visual") ? "\nVisual audit (not gating): see artifact `visual-audit` on the run below." : "",
              `[Logs and artifact](${run})`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes("<!-- preview-tests -->"));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body });

      - name: Fail the job if a suite failed
        env:
          RESULTS: unit=${{ needs.unit.result }} stamps=${{ needs.stamps.result }} preview=${{ needs.preview.result }} api=${{ needs.api.result }} browser=${{ needs.browser.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
        run: |
          echo "$RESULTS (docs_only=$DOCS_ONLY)"
          for r in ${{ needs.unit.result }} ${{ needs.stamps.result }}; do [ "$r" = "success" ] || { echo "::error::Preview tests failed ($RESULTS)."; exit 1; }; done
          if [ "$DOCS_ONLY" != "true" ]; then
            for r in ${{ needs.api.result }} ${{ needs.browser.result }}; do [ "$r" = "success" ] || { echo "::error::Preview tests failed ($RESULTS)."; exit 1; }; done
          fi
