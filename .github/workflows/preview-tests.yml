name: Preview Tests

# Runs on draft and ready PRs from branches of this repository. Fork PRs get no job here, so they can never earn the gate phrase.
# LIGHT by default (GitHub minutes are metered, see docs/runbooks/ci-minutes.md): every push runs only scope, unit, stamps and report.
# The preview, api, browser and layout jobs run only when the PR carries the label `ci-full`; adding the label starts the full run (event `labeled`).
# The comment `### Preview tests: passed (<sha7>)` is the merge gate; a light run posts `### Light checks: ...` instead, which never matches the gate.
# A PR that changes only docs (tools/docs-only.mjs) gets no preview, so only unit and stamps run and the comment says `passed (docs only)`.
# Label events other than `labeled ci-full` start a run whose jobs are all skipped (0 minutes) and never cancel a run in progress.
# Removing `ci-full` is ignored here (a pass for the head sha stays valid); pr-preview-cloudflare.yml tears the preview down then.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # A real event cancels the older run. An unrelated label event (security, visual, ...) must not: it waits behind the run and skips every job.
  cancel-in-progress: ${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-full') }}

permissions:
  contents: read
  pull-requests: write

env:
  # Pinned action SHAs (tag in the comment on each use):
  #   actions/checkout          11bd71901bbe5b1630ceea73d27597364c9af683 v4.2.2
  #   actions/setup-node        39370e3970a6d050c480ffad4ff0ed4d3fdee5af v4.1.0
  #   actions/upload-artifact   b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 v4.4.3
  #   actions/github-script     60a0d83039c74a4aee543508d2ffcb1c3799cdea v7.0.1
  #   actions/download-artifact fa0a91b85d4f404e444e00e005971372dc801d16 v4.1.8
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  scope:
    name: scope
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'unlabeled' && (github.event.action != 'labeled' || github.event.label.name == 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      site_changed: ${{ steps.classify.outputs.site_changed }}
      full: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths.txt"
          cat "$RUNNER_TEMP/paths.txt"
          echo "docs_only=$(node tools/docs-only.mjs < "$RUNNER_TEMP/paths.txt")" >> "$GITHUB_OUTPUT"
          echo "site_changed=$(node tools/ci-scope.mjs < "$RUNNER_TEMP/paths.txt")" >> "$GITHUB_OUTPUT"

  unit:
    name: unit
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'unlabeled' && (github.event.action != 'labeled' || github.event.label.name == 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies (yaml, for the snapshot contract test)
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: |
          set -o pipefail
          node --test "tests/unit/*.test.mjs" 2>&1 | tee "$RUNNER_TEMP/unit.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: preview-test-logs-unit
          path: ${{ runner.temp }}/unit.log
          if-no-files-found: ignore

  stamps:
    name: stamps
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'unlabeled' && (github.event.action != 'labeled' || github.event.label.name == 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Stamps check
        run: |
          set -o pipefail
          node tools/stamps.mjs --check 2>&1 | tee "$RUNNER_TEMP/stamps.log"

      - name: Legal pages check
        run: node tools/render-legal.mjs --check

  # Preview secrets are optional and never fall back to production secrets (those live in the GitHub environment `production`, restricted to master).
  # Missing secrets skip preview, api, browser and layout with a notice; the report then says SKIPPED (not the merge gate). See docs/runbooks/ci-secrets.md.
  preview-secrets:
    name: preview-secrets
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: none
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    env:
      PREVIEW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_ADMIN_TOKEN: ${{ secrets.BOARD_PREVIEW_ADMIN_TOKEN }}
      PREVIEW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check CLOUDFLARE_API_TOKEN, BOARD_PREVIEW_ADMIN_TOKEN and CLOUDFLARE_ACCOUNT_ID
        id: check
        run: |
          MISSING=""
          [ -n "$PREVIEW_API_TOKEN" ] || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "$PREVIEW_ADMIN_TOKEN" ] || MISSING="$MISSING BOARD_PREVIEW_ADMIN_TOKEN"
          [ -n "$PREVIEW_ACCOUNT_ID" ] || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview tests skipped::Preview, api, browser and layout were skipped because these repository secrets are missing:$MISSING. The preview admin token never falls back to a production secret. The comment says SKIPPED and is not the merge gate. See docs/runbooks/ci-secrets.md."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  preview:
    name: preview
    needs: [scope, preview-secrets]
    # Only with the label `ci-full` (the spin-up in pr-preview-cloudflare.yml has the same condition), never for docs-only PRs, and only with the preview secrets.
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.docs_only != 'true' && needs.preview-secrets.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      pages: ${{ steps.urls.outputs.pages }}
      worker: ${{ steps.urls.outputs.worker }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the preview URLs in the PR comment
        id: urls
        run: |
          set -u
          SHORT="${HEAD_SHA:0:7}"
          for i in $(seq 1 48); do
            BODY=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[] | select(.body | contains("<!-- cloudflare-pr-preview -->"))] | last | .body // ""' || true)
            # The comment is updated in place; accept it only once it names this commit and is not the teardown notice.
            if echo "$BODY" | grep -q "$SHORT" && ! echo "$BODY" | grep -q "Torn Down"; then
              PAGES=$(echo "$BODY" | grep -oE "https://pr-${PR_NUMBER}\.leeroy-board\.pages\.dev" | head -n 1 || true)
              WORKER=$(echo "$BODY" | grep -oE "https://leeroy-brain-pr-${PR_NUMBER}\.[a-z0-9-]+\.workers\.dev" | head -n 1 || true)
              if [ -n "$PAGES" ] && [ -n "$WORKER" ]; then
                echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
                echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
                echo "Preview found: $PAGES and $WORKER (commit $SHORT)"
                exit 0
              fi
            fi
            echo "Attempt $i/48: preview comment for $SHORT not ready, waiting 15 s"
            sleep 15
          done
          echo "::error::No preview comment for commit $SHORT within 12 minutes."
          exit 1

      - name: Wait for the preview to answer
        env:
          WORKER_URL: ${{ steps.urls.outputs.worker }}
          PAGES_URL: ${{ steps.urls.outputs.pages }}
        run: |
          set -u
          for i in $(seq 1 40); do
            H=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/api/health" || echo 000)
            P=$(curl -s -o /dev/null -w "%{http_code}" "$PAGES_URL/" || echo 000)
            echo "Attempt $i/40: worker health $H, pages $P"
            if [ "$H" = "200" ] && [ "$P" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::Preview did not answer 200 in time."
          exit 1

  api:
    name: api
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: API tests
        working-directory: tests
        env:
          PREVIEW_API: ${{ needs.preview.outputs.worker }}
          PREVIEW_PAGES: ${{ needs.preview.outputs.pages }}
          PREVIEW_ADMIN_BASE: ${{ secrets.BOARD_PREVIEW_ADMIN_TOKEN }}
        run: |
          set -o pipefail
          # The preview Worker holds a per-PR token derived from the preview-only secret (see pr-preview-cloudflare.yml), never a production one.
          if [ -z "$PREVIEW_ADMIN_BASE" ]; then
            echo "::error::BOARD_PREVIEW_ADMIN_TOKEN is missing. The preview-secrets job should have skipped this job; there is no fallback to a production secret."
            exit 1
          fi
          BOARD_ADMIN_TOKEN=$(printf '%s' "preview:BOARD_ADMIN_TOKEN:leeroy-brain-pr-$PR_NUMBER" | openssl dgst -sha256 -hmac "$PREVIEW_ADMIN_BASE" -r | cut -d' ' -f1)
          echo "::add-mask::$BOARD_ADMIN_TOKEN"
          export BOARD_ADMIN_TOKEN
          unset PREVIEW_ADMIN_BASE
          npm run test:api 2>&1 | tee "$RUNNER_TEMP/api.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: preview-test-logs-api
          path: ${{ runner.temp }}/api.log
          if-no-files-found: ignore

  browser:
    name: browser
    needs: [scope, preview]
    # Skipped when no site, tooling, workflow, config or dependency file changed (Worker-only, test-only, docs-only): tools/ci-scope.mjs decides.
    # Also skipped when the preview is (no `ci-full`): a skipped needs-dependency skips the job.
    if: needs.scope.outputs.site_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests
        run: |
          sudo apt-get update
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Browser smoke
        working-directory: tests
        env:
          PREVIEW_API: ${{ needs.preview.outputs.worker }}
          SMOKE_ALLOW_WEBKIT_NO_WEBGL: "1"
          SMOKE_REQUIRE_ENGINES: "1"   # a browser engine that is not installed FAILS the job instead of printing a WARN and skipping its checks
          PAGES_URL: ${{ needs.preview.outputs.pages }}
          LAYOUT_SWEEP_SKIP: "1"
        run: |
          set -o pipefail
          npm run test:browser -- --url "$PAGES_URL/" 2>&1 | tee "$RUNNER_TEMP/browser.log"

      - name: Worker request summary
        if: always()
        run: |
          # Report only. Every suite except deploy-smoke answers /api/ from tests/fixtures/api-snapshot and prints how many reads it served without touching the Worker;
          # deploy-smoke is the live one (15 requests: 3 API checks + 6 per engine x 2 engines, measured). A stub miss fails the suite (API_STUB_ALLOW_MISS=1 opts out). See docs/runbooks/cloudflare-requests.md.
          { echo "### Worker requests (browser job)"; grep -h "api-stub" "$RUNNER_TEMP/browser.log" | sort | uniq -c | sort -rn | head -30 || true; echo "Live suites: deploy-smoke only (15 requests)."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: preview-test-logs-browser
          path: ${{ runner.temp }}/browser.log
          if-no-files-found: ignore

  layout:
    # Layout invariants sweep (tests/browser/layout-sweep.mjs): 18 viewport sizes x 3 visitor states x 12 scenes on Chromium, judged by DOM
    # rules (close button inside the viewport and uncovered, no overlap in the header, title not cut, 44 px touch height, no sideways scroll, no 4xx/5xx).
    # Gating: it is in the report's needs. The sweep stops itself at 9 minutes (--budget-min) and fails if it did not finish; the mutation test after it takes about 20 s
    # (tests/helpers/layout-sweep-mutation.mjs: proves the sweep still FAILS on 4 injected layout bugs, 0 Worker requests); the job limit is 20 and the full sweep budget 9 min (with the launch hero up, 6.8 min of work: the 5 min budget ran out at 588 of 675 cells on PR 163; B49 also added three gate-only sweeps at faked clocks, about 45 s each).
    name: layout
    needs: [scope, preview]
    # Skipped when no site, tooling, workflow, config or dependency file changed: tools/ci-scope.mjs decides. Also skipped without `ci-full` (no preview).
    if: needs.scope.outputs.site_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Layout sweep
        working-directory: tests
        env:
          PAGES_URL: ${{ needs.preview.outputs.pages }}
        run: |
          set -o pipefail
          node browser/layout-sweep.mjs --url "$PAGES_URL/" --engine chromium --budget-min 9 --out "$RUNNER_TEMP/layout-report.json" 2>&1 | tee "$RUNNER_TEMP/layout.log"

      - name: Layout sweep at the launch times (gating)
        # B49: the launch hero shows from 24 h before launch (Nov 4 2026 23:00Z) to 24 h after. The first-visit screen must still fit, and no covered-wall art may load before the first tap (first-load-weight), at a faked clock before it, with it, and after launch.
        # First-visit gate only, ~40 s each on Chromium; the API comes from tests/fixtures/api-snapshot, 0 requests to the Worker.
        working-directory: tests
        env:
          PAGES_URL: ${{ needs.preview.outputs.pages }}
        run: |
          set -o pipefail
          rc=0
          for clock in 2026-11-03T22:10:00Z 2026-11-04T10:00:00Z 2026-11-05T14:00:00Z; do
            node browser/layout-sweep.mjs --url "$PAGES_URL/" --engine chromium --states gate --clock "$clock" --budget-min 2 2>&1 | tee -a "$RUNNER_TEMP/layout-clock.log" || rc=1
            node browser/first-load-weight.mjs --url "$PAGES_URL/" --clock "$clock" 2>&1 | tee -a "$RUNNER_TEMP/layout-clock.log" || rc=1
            node browser/axe.mjs --url "$PAGES_URL/" --clock "$clock" 2>&1 | tee -a "$RUNNER_TEMP/layout-clock.log" || rc=1
          done
          exit $rc

      - name: Layout sweep mutation test (gating)
        # The sweep must still FAIL on injected layout bugs (tests/fixtures/layout-mutations), otherwise a green sweep proves nothing. Gating: a failing step fails the job.
        working-directory: tests
        env:
          PAGES_URL: ${{ needs.preview.outputs.pages }}
        run: |
          set -o pipefail
          node helpers/layout-sweep-mutation.mjs --url "$PAGES_URL/" 2>&1 | tee "$RUNNER_TEMP/layout-mutation.log"

      - name: Worker request summary
        if: always()
        run: |
          { echo "### Worker requests (layout job)"; grep -h "api-stub" "$RUNNER_TEMP/layout.log" "$RUNNER_TEMP/layout-clock.log" || true; echo "The sweep and the mutation test answer /api/ from tests/fixtures/api-snapshot: 0 requests to the Worker."; grep -h "layout-sweep-mutation" "$RUNNER_TEMP/layout-mutation.log" || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: preview-test-logs-layout
          path: |
            ${{ runner.temp }}/layout.log
            ${{ runner.temp }}/layout-mutation.log
            ${{ runner.temp }}/layout-report.json
          if-no-files-found: ignore

  visual-audit:
    # Non-gating: measures image sizes, overflow, contrast, layout shift and more. Not in the report's needs,
    # so it never changes the pass or fail result. Only runs for PRs labelled `visual`.
    name: visual-audit
    needs: preview
    if: contains(github.event.pull_request.labels.*.name, 'visual')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests
        run: |
          sudo apt-get update
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Visual audit
        working-directory: tests
        env:
          PREVIEW_PAGES: ${{ needs.preview.outputs.pages }}
          AUDIT_BUDGET_MIN: "10"
          AUDIT_OUT: visual-audit
        run: |
          node visual/audit.mjs 2>&1 | tee "$RUNNER_TEMP/visual-audit.log" || true

      - name: Worker request summary
        if: always()
        run: |
          # The audit answers /api/ from tests/fixtures/api-snapshot like the browser suites (one line per engine), so it sends 0 requests to the Worker.
          { echo "### Worker requests (visual-audit job)"; grep -h "api-stub" "$RUNNER_TEMP/visual-audit.log" || true; echo "The audit answers /api/ from tests/fixtures/api-snapshot: 0 requests to the Worker."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the visual audit
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: visual-audit
          path: tests/visual-audit
          if-no-files-found: ignore
          retention-days: 14


  report:
    name: report
    needs: [scope, unit, stamps, preview-secrets, preview, api, browser, layout]
    # Not on cancel: a newer push cancels this run and its own run posts the result for the newer commit.
    # The comment is the merge gate, so skipped dependencies are judged by tools/ci-report.mjs, never by a blanket `!= 'failure'`.
    if: always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'unlabeled' && (github.event.action != 'labeled' || github.event.label.name == 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Download the logs
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: preview-test-logs-*
          path: ${{ runner.temp }}/logs
          merge-multiple: true

      - name: Build the result comment
        id: build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SITE_CHANGED: ${{ needs.scope.outputs.site_changed }}
          FULL: ${{ needs.scope.outputs.full }}
          UNIT_RESULT: ${{ needs.unit.result }}
          STAMPS_RESULT: ${{ needs.stamps.result }}
          API_RESULT: ${{ needs.api.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          LAYOUT_RESULT: ${{ needs.layout.result }}
          PREVIEW_SECRETS: ${{ needs.preview-secrets.outputs.enabled }}
          RUN_ID: ${{ github.run_id }}
          PAGES_URL: ${{ needs.preview.outputs.pages }}
          VISUAL: ${{ contains(github.event.pull_request.labels.*.name, 'visual') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/ci-report.mjs "$RUNNER_TEMP/report.md"

      - name: Post or update the result comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, "utf8");
            const pr = context.payload.pull_request;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100 });
            // Only a comment written by this workflow's bot is ever updated; a lookalike from anyone else is ignored.
            const existing = comments.find((c) => c.user && c.user.login === "github-actions[bot]" && c.user.type === "Bot" && c.body && c.body.includes("<!-- preview-tests -->"));
            const { data: posted } = existing
              ? await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
              : await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body });
            // Read it back so the next step checks what GitHub stored, not what we sent.
            const { data: stored } = await github.rest.issues.getComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: posted.id });
            if (stored.user.login !== "github-actions[bot]" || stored.user.type !== "Bot") core.setFailed(`The result comment was written by ${stored.user.login}, not github-actions[bot].`);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/posted.md`, stored.body, "utf8");

      - name: Verify the comment is from this run and this commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: node tools/ci-report.mjs --verify "$RUNNER_TEMP/posted.md"

      - name: Fail the job if a suite failed
        env:
          OK: ${{ steps.build.outputs.ok }}
          RESULTS: unit=${{ needs.unit.result }} stamps=${{ needs.stamps.result }} preview=${{ needs.preview.result }} api=${{ needs.api.result }} browser=${{ needs.browser.result }} layout=${{ needs.layout.result }} full=${{ needs.scope.outputs.full }} docs_only=${{ needs.scope.outputs.docs_only }} site_changed=${{ needs.scope.outputs.site_changed }}
        run: |
          echo "$RESULTS"
          [ "$OK" = "true" ] || { echo "::error::Checks failed ($RESULTS)."; exit 1; }
