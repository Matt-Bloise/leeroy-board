name: Pages Prune (manual)

# Deletes the OLD Cloudflare Pages deployments (they still serve the member data files the current bundle no longer carries) and purges the stale data files from the
# leeroy.party edge cache. MANUAL ONLY: workflow_dispatch, no push, schedule or pull_request trigger. Dry run by default: it prints counts and changes nothing.
# Runbook: docs/runbooks/pages-prune.md. Script: tools/pages-prune.mjs (keeps the production deployment, fails closed, prints counts only: this repository is public, so is this log).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only count what would be deleted and purged. Untick to delete for real (there is no undo for a deleted deployment)."
        type: boolean
        default: true
      purge_cache:
        description: "Also purge the private data files from the leeroy.party edge cache (needs Zone > Cache Purge; skipped with one line if the token lacks it)."
        type: boolean
        default: true
      max_delete:
        description: "Refuse to delete when more deployments than this qualify. Raise it only on purpose."
        type: number
        default: 2000

permissions:
  contents: read

concurrency:
  group: pages-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune old Pages deployments and purge the edge cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same rule as the production deploy: only the master copy of this workflow may run.
    if: github.ref == 'refs/heads/master'
    env:
      PAGES_PROJECT_NAME: leeroy-board
    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Delete old Pages deployments (counts only in a dry run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_DELETE: ${{ inputs.max_delete }}
        run: node tools/pages-prune.mjs prune

      - name: Purge the private data files from the leeroy.party edge cache
        # Runs even when the prune step stopped (fail closed): a stale cached file is wrong either way. Never fails the job.
        if: ${{ !cancelled() && inputs.purge_cache }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node tools/pages-prune.mjs purge
