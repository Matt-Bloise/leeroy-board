name: Terms Watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: terms-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Compare Blizzard terms pages with the stored hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch pages and compare
        run: node tools/terms-watch.mjs --report "$RUNNER_TEMP/report.md"

      - name: Open an issue when something changed
        run: |
          if [ ! -s "$RUNNER_TEMP/report.md" ]; then echo "No change (or pages unreachable): no issue opened."; exit 0; fi
          existing=$(gh issue list --state open --search '"Blizzard terms changed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open; adding a comment."
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "Blizzard terms changed" --body-file "$RUNNER_TEMP/report.md"
          fi
