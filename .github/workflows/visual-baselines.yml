name: Visual Baselines

# Renders the visual baselines on the CI image from the branch this workflow is run on, and commits them to that branch (docs/runbooks/visual-baselines.md).
# Use it when the visual gate (job `visual` in preview-tests.yml) fails for a change you intend: Actions > Visual Baselines > Run workflow > "Use workflow from" = your PR branch.
# Merge master into the branch first: Preview Tests renders the PR merged with master, so baselines rendered from a stale branch can fail there.
# Never on the default branch (every push to master deploys). Two jobs:
#   render  runs the branch's code (tools/static-server.mjs, tests/browser/visual-baseline.mjs) with a READ-ONLY token and uploads the PNGs;
#   commit  runs no code from the branch (no npm, no node, no script from the checkout), takes only files named like a baseline from that artifact, checks they are PNGs,
#           and pushes one commit to the branch with the GITHUB_TOKEN, only if the branch still points at the commit that was rendered.
# A push made with the GITHUB_TOKEN starts no workflow: push your next commit (or add the ci-full label) to run Preview Tests on it.
# commit=false renders and COMPARES instead (with --repeat, the calibration run: the noise between repeat shots and against the committed baselines), and commits nothing.
# only / sizes narrow a commit=false run to some screens or sizes (hunting a flake: --only timeline --sizes 390x844 --repeat 20).

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the rendered baselines to this branch (false: compare only and report the noise)"
        type: boolean
        default: true
      repeat:
        description: "Shots per screen: 1 to 5 when committing; 1 to 30 when not. A screen whose repeat shots disagree is not written (default 3)"
        required: false
        default: "3"
      only:
        description: "Only these screens, comma separated, e.g. timeline,wall (needs commit off: a partial set is never committed)"
        required: false
        default: ""
      sizes:
        description: "Only these sizes, comma separated: 390x844, 1366x768 (needs commit off)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: render
    # Branches only, never the default branch.
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Pinned action SHAs: checkout 11bd71901bbe5b1630ceea73d27597364c9af683 v4.2.2, setup-node 39370e3970a6d050c480ffad4ff0ed4d3fdee5af v4.1.0,
    # cache 1bd1e32a3bdc45362d1e726936510720a7c30a57 v4.2.0, upload-artifact b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 v4.4.3
    steps:
      - name: Check the inputs
        env:
          REPEAT: ${{ inputs.repeat }}
          ONLY: ${{ inputs.only }}
          SIZES: ${{ inputs.sizes }}
          COMMIT: ${{ inputs.commit }}
        run: |
          case "$REPEAT" in ''|*[!0-9]*) echo "::error::repeat must be a number"; exit 1 ;; esac
          if [ "$REPEAT" -lt 1 ] || [ "$REPEAT" -gt 30 ]; then echo "::error::repeat must be 1 to 30"; exit 1; fi
          printf '%s\n' "$ONLY" | grep -Eq '^[a-z0-9,-]*$' || { echo "::error::only must be screen names, comma separated"; exit 1; }
          printf '%s\n' "$SIZES" | grep -Eq '^((390x844|1366x768)(,(390x844|1366x768))*)?$' || { echo "::error::sizes must be 390x844 and/or 1366x768, comma separated"; exit 1; }
          if [ "$COMMIT" = "true" ] && { [ "$REPEAT" -gt 5 ] || [ -n "$ONLY" ] || [ -n "$SIZES" ]; }; then echo "::error::A committed render is the whole set: repeat 1 to 5, no only, no sizes"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Cache the Playwright browsers (keyed on the lockfile, as in preview-tests.yml)
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install test dependencies
        timeout-minutes: 15
        working-directory: tests
        run: |
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "3";' 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99ci-resilient >/dev/null
          install() { sudo apt-get update && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium; }
          for attempt in 1 2; do
            if install; then exit 0; fi
            echo "::warning::Install attempt $attempt failed."
          done
          echo "::error::Installing the test dependencies failed twice."
          exit 1

      - name: Serve this checkout
        run: |
          nohup node tools/static-server.mjs 8080 > "$RUNNER_TEMP/static.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8080/index.html && exit 0; sleep 1; done
          echo "::error::The static server did not answer"; cat "$RUNNER_TEMP/static.log"; exit 1

      - name: Render the baselines
        if: inputs.commit
        working-directory: tests
        env:
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -o pipefail
          node browser/visual-baseline.mjs --url "http://127.0.0.1:8080/" --write-baselines "$RUNNER_TEMP/baselines" --repeat "$REPEAT" --out "$RUNNER_TEMP/visual-out" 2>&1 | tee "$RUNNER_TEMP/visual.log"
          ls -l "$RUNNER_TEMP/baselines"

      - name: Compare with the committed baselines (calibration)
        if: ${{ !inputs.commit }}
        working-directory: tests
        env:
          REPEAT: ${{ inputs.repeat }}
          ONLY: ${{ inputs.only }}
          SIZES: ${{ inputs.sizes }}
        run: |
          set -o pipefail
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ -n "$SIZES" ]; then ARGS+=(--sizes "$SIZES"); fi
          node browser/visual-baseline.mjs --url "http://127.0.0.1:8080/" --repeat "$REPEAT" "${ARGS[@]}" --out "$RUNNER_TEMP/visual-out" 2>&1 | tee "$RUNNER_TEMP/visual.log"

      - name: Upload the rendered baselines
        if: inputs.commit
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/baselines/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: visual-baselines-report
          path: |
            ${{ runner.temp }}/visual-out
            ${{ runner.temp }}/visual.log
          if-no-files-found: ignore
          retention-days: 14

  commit:
    name: commit
    needs: render
    if: inputs.commit && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Pinned action SHAs: checkout 11bd71901bbe5b1630ceea73d27597364c9af683 v4.2.2, download-artifact fa0a91b85d4f404e444e00e005971372dc801d16 v4.1.8
    steps:
      - name: Checkout the branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: Refuse when the branch moved since the render, or is the default branch
        env:
          RENDERED: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$BRANCH" = "$DEFAULT" ] || [ "$BRANCH" = "master" ]; then echo "::error::Never commits to the default branch."; exit 1; fi
          HEAD=$(git rev-parse HEAD)
          if [ "$HEAD" != "$RENDERED" ]; then echo "::error::$BRANCH moved from $RENDERED to $HEAD after the render; run the workflow again."; exit 1; fi

      - name: Download the rendered baselines
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/new

      - name: Replace tests/browser/baselines with the rendered set
        run: |
          set -eu
          NEW="$RUNNER_TEMP/new"
          COUNT=0
          for f in "$NEW"/*; do
            n=$(basename "$f")
            # only <screen>-<size>.png at the two sizes, a real file, a PNG signature, under 5 MB
            printf '%s' "$n" | grep -qE '^[a-z0-9]+(-[a-z0-9]+)*-(390x844|1366x768)\.png$' || { echo "::error::Unexpected file in the artifact: $n"; exit 1; }
            [ -f "$f" ] && [ ! -L "$f" ] || { echo "::error::$n is not a regular file"; exit 1; }
            [ "$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a" ] || { echo "::error::$n is not a PNG"; exit 1; }
            [ "$(stat -c %s "$f")" -lt 5000000 ] || { echo "::error::$n is over 5 MB"; exit 1; }
            COUNT=$((COUNT + 1))
          done
          [ "$COUNT" -gt 0 ] || { echo "::error::The artifact holds no baseline"; exit 1; }
          mkdir -p tests/browser/baselines
          rm -f tests/browser/baselines/*.png
          cp "$NEW"/*.png tests/browser/baselines/
          git add -A tests/browser/baselines
          git status --short tests/browser/baselines
          echo "$COUNT baselines in the rendered set."

      - name: Commit and push to the branch
        env:
          BRANCH: ${{ github.ref_name }}
          RENDERED: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          if git diff --cached --quiet; then echo "The rendered baselines equal the committed ones: nothing to commit."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Visual baselines rendered on the CI image from ${RENDERED:0:7}" -m "Rendered by $RUN_URL (tests/browser/visual-baseline.mjs --write-baselines)."
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Pushed $(git rev-parse --short HEAD) to $BRANCH."
