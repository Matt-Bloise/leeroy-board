<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Page not found - Leeroy board</title>
<style>:root{--bg:#14100c;--text:#f3ead6;--dim:#d8caa8;--brass:#eecd8c;--ink:#2b1d10}
@media (prefers-color-scheme:light){:root{--bg:#f6efde;--text:#2b1d10;--dim:#46331f;--brass:#7a3a12;--ink:#fff}}
*{box-sizing:border-box}
html{color-scheme:dark light}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:34rem;margin:0 auto;padding:12vh 16px 2rem}
h1{font-size:1.8rem;line-height:1.2;margin:0 0 .8rem}
p{color:var(--dim);margin:0 0 1.2rem}
a{display:inline-block;min-height:48px;padding:12px 24px;background:var(--brass);color:var(--ink);font-weight:700;text-decoration:none;border-radius:8px}
a:focus-visible{outline:3px solid var(--text);outline-offset:3px}</style>
</head>
<body>
<main id="main">
<h1>That page is not here</h1>
<p>The link may be old or mistyped. The board is still where you left it.</p>
<a href="/">Back to the board</a>
</main>
</body>
</html>
