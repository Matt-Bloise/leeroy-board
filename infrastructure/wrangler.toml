name = "leeroy-brain"
main = "worker/index.js"
compatibility_date = "2025-02-01"
workers_dev = true

# Custom Domain binding on Cloudflare Free Tier
# Automatically provisions edge SSL and routes https://api.leeroy.party to this Worker
routes = [
  { pattern = "api.leeroy.party", custom_domain = true }
]

# 6-Hour autonomous source sweep (Blizzard news, Wowhead, Raidplan, Wiki)
# 4 runs/day keeps background AI fact extraction strictly under the 10,000 Workers AI neuron/day free limit.
# Live on-demand refreshes remain available via UI and /intent { kind: "refresh" }.
# Plus "* * * * *": the timed Discord posts (worker/moments.js). It does nothing unless MOMENTS_ENABLED is on, and it reads no
# D1 rows while off. Workers Free allows 5 cron triggers per account, so this is the second of five.
[triggers]
crons = ["0 */6 * * *", "* * * * *"]

# Cloudflare D1 Serverless SQLite Database (Free Tier: 5 GB storage, 5M reads/day, 100k writes/day)
# Workers Logs (free plan: 200,000 events a day, 3 days retention). Added so answer failures, provider fallbacks and delivery times are visible; console.log lines are captured as custom logs.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "leeroy-board-db"
database_id = "00000000-0000-0000-0000-000000000000" # Replaced automatically in CI or via `wrangler d1 create`
migrations_dir = "migrations"

# Hibernatable WebSocket Durable Object (Free Tier: SQLite-backed, 100k req/day)
[durable_objects]
bindings = [
  { name = "BOARD_ROOM", class_name = "BoardRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]

# Native Cloudflare Workers AI Binding (Free Tier: 10,000 Neurons/day, Zero external API key needed)
[ai]
binding = "AI"

# Anthropic key route 2 (not enabled): a Cloudflare Secrets Store binding (open beta). Create the secret in the dashboard, never here;
# read in code with `await env.ANTHROPIC_KEY_STORE.get()` (worker/ai-keys.js). Production only: the value cannot be read in local dev.
# [[secrets_store_secrets]]
# binding = "ANTHROPIC_KEY_STORE"
# store_id = "<your-store-id>"
# secret_name = "anthropic_api_key"

# Cloudflare Flagship feature flags. The production deploy creates a missing flag with wrangler (disabled, tools/flagship-ensure-flags.mjs); the owner flips it (dashboard or wrangler flagship flags enable). CI never enables or edits a flag.
# The app_id is an identifier, not a secret. PR preview Workers must NOT bind to this production app: the PR preview deploy strips this block
# (tools/strip-flagship-binding.mjs) so previews keep the legacy flag values declared in the vars table below. See docs/runbooks/flags.md.
[[flagship]]
binding = "FLAGS"
app_id = "1f0b836c-4929-4728-8bee-6b8bde677e79"

[vars]
# Default AI provider ("claude", "gemini", "workers-ai", "groq", "cerebras", "github", or "openrouter")
# Can also be switched per-question in the UI or Discord `/ask` command.
AI_PROVIDER = "claude"
AI_GATEWAY_ID = "leeroy-ai-gateway"
# Anthropic key route 1 (preferred): "on" = BYOK. The key is stored in the AI Gateway (dashboard, AI Gateway, Provider Keys) and never enters the Worker;
# Claude requests carry only cf-aig-authorization (no x-api-key) and never fall back to the direct endpoint (a gateway failure falls back to Workers AI).
# Needs AI_GATEWAY_TOKEN and an authenticated gateway. "off" keeps the Secrets Store / ANTHROPIC_API_KEY routes. Never put a key in this file.
ANTHROPIC_BYOK = "off"
AI_GATEWAY_CACHE_TTL = "21600" # 6 hours: aligned with the 6-hour cron sweep ("0 */6 * * *")
CLOUDFLARE_ACCOUNT_ID = ""
CLAUDE_MODEL_FAST = "claude-haiku-4-5-20251001"
CLAUDE_MODEL_DEEP = "claude-sonnet-4-5-20250929"
# ASK_RESEARCH only (worker/research/claude.js): Claude is the first hop of the research chain, after tokenising and the outbound guards. The 5-5 ids are UNVERIFIED against the
# provider's model list; a 404/400 "model not found" answer retries once with the fallback id. The legacy CLAUDE_MODEL_* vars above are untouched and still serve the flag-off path.
RESEARCH_CLAUDE_MODEL_FAST = "claude-haiku-5-5"
RESEARCH_CLAUDE_MODEL_DEEP = "claude-sonnet-5-5"
RESEARCH_CLAUDE_FALLBACK_FAST = "claude-haiku-4-5-20251001"
RESEARCH_CLAUDE_FALLBACK_DEEP = "claude-sonnet-4-5-20250929"
RESEARCH_CLAUDE_MONTHLY_TOKENS = "5000000" # monthly Claude token bound (input + output, UTC month, D1 kv_state claude_tokens_YYYYMM); at or over it the degraded line answers (research/provider.js) and one alert row is written; a bad value means this default, never unlimited
# ASK_RESEARCH only, read in worker/research/ only (never Flagship): "real" sends the Claude hop real names, sheet fields, builds and the asker's turns untokenised and does not run the name guard (the friends have consented; docs/privacy.md); "tokenised" keeps the per-request tokens and the strict name guard. Unset or any other value reads as "tokenised". Secrets, ids, pings and the host allow-list are guarded in both modes.
RESEARCH_NAMES = "real"
GEMINI_MODEL_FAST = "gemini-3.5-flash-lite"
GEMINI_MODEL_DEEP = "gemini-3.8-pro"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GROQ_MODEL_FAST = "llama-3.3-70b-versatile"
GROQ_MODEL_DEEP = "llama-3.3-70b-versatile"
CEREBRAS_MODEL = "llama-3.3-70b"
GITHUB_MODEL_FAST = "gpt-4o-mini"
GITHUB_MODEL_DEEP = "gpt-4o"
OPENROUTER_MODEL = "deepseek/deepseek-chat-v3-0324:free"
API_ORIGIN = "https://api.leeroy.party"
BOARD_PUBLIC_URL = "https://leeroy.party"
WEB_LOGIN = "off" # Q18 web Discord login: "on" enables /api/auth/discord/start, /callback, /api/auth/logout and cookie sessions on GET /api/me
DATA_RIGHTS = "off" # Q59 member data export and erase: "on" enables GET /api/me/export and POST /api/me/erase (404 while off)
EVENTS_ENABLED = "off" # Discord scheduled events: "on" enables POST /api/admin/events/sync (404 while off); see docs/runbooks/scheduled-events.md
MOMENTS_ENABLED = "off" # timed Discord posts (docs/runbooks/moments.md): "on" lets the every-minute cron post. The PC bot stays authoritative for launch night (Nov 3 to 4): leave off until after launch.
MOMENTS_SHADOW = "off" # shadow mode: plans and writes would_post / would_edit rows to the D1 ledger, never calls Discord. Exclusive with MOMENTS_ENABLED (both on = nothing runs).
MOMENTS_DRY_RUN = "off" # "on" logs what would be posted and posts nothing (works with MOMENTS_ENABLED off)
D1_FEED = "off" # "on" computes GET /api/data/stats from D1 (cached 5 minutes in kv_state, falls back to the stored document on error); timeline and tonight have no D1 source yet
CHARS_V1 = "off" # "on" returns characters in GET /api/me for a web session and enables POST /api/me/characters (add, rename, select); needs migration 0005; 404 while off
ALLOWED_ORIGINS = "https://matt-bloise.github.io,https://leeroy-board.pages.dev,https://leeroy.party,https://www.leeroy.party,https://api.leeroy.party,https://1561857940174938114.discordsays.com"
BUILD_MODAL = "off" # Q19 /build modal with a handle field, and /join (listed in the command manifest only while on). "on" enables it
BUILD_PROJECT = "off" # needs BUILD_MODAL on. "on": a confirmed submit also writes the roster entry and the party document in one atomic batch, then purges and broadcasts
JOIN_PROMPT = "off" # needs BUILD_MODAL on. "on": an unknown Discord user of /ask or /sheet gets one ephemeral hint with a Join button
# Flags the Worker reads that were not declared here. All default off (the code treats unset the same as "off"); declaring them makes the off state visible and reviewable. Behaviour is unchanged.
ANSWER_UX = "off" # "on" adds the Helpful/Off vote buttons and the More / Sources detail buttons under Discord answers (worker/answer-ux.js; unset reads as off)
ASK_OPENER = "off" # "on" puts one deterministic in-voice line (worker/ask-opener.js) in front of an answer's cited facts, never on a refusal, abstain, unconfirmed-figure or coach answer and only when a valid citation survives; "off" or unset removes it (ships off until the /ask evaluation has run on the merged code)
ASK_RESEARCH = "on" # "on" turns /ask research mode on (worker/research/): a member's model call runs on Claude only (Sonnet-class compose, one Haiku-class retry, under a monthly token cap and the always-on outbound guards; see RESEARCH_NAMES), and when Claude cannot answer the reply is an honest in-voice line plus library facts, marked +degraded: friend text never reaches Workers AI, Gemini or any other provider (a guest, who has no friend history, keeps the tokenised Workers AI path); a question the library cannot answer gets a model answer from Classic-era knowledge instead of the code-written abstain, unsupported numbers and names are labelled "not confirmed for Forever" instead of deleted, and the answer ends with one Sources/confidence line; "off" or unset keeps the old path byte for byte. Read from [vars] only (not on Flagship), so flipping it is a deploy; never on in a PR preview; a flag read that throws counts as on for provider forcing
GROUP_MEMORY = "off" # "on" (only with ASK_RESEARCH on; never in a PR preview) keeps the group's asks and answers in D1 (tables group_log and group_wiki, migration 0011), reads them back into a roster member's research prompt (Claude only, real names only) and runs the wiki refresher from the 6-hour cron (one Haiku-class call, under the monthly Claude token cap); see docs/runbooks/group-memory.md. "off" or unset: no read, no write, no cron work.
LISTENER = "off" # "dry" or "live" turns the Discord listener on (worker/listener.js, POST /api/listen, needs a Discord bot token (DISCORD_BOT_TOKEN: the signing key is derived from it, there is no separate secret) and ASK_RESEARCH on; never in a PR preview): a signed message event from the PC forwarder is answered when it tags or replies to Leeroy (dry: a private turn, nothing posted, the would-be reply kept in the private turn that listen_events points to; live: posted as a reply with every ping off) and, with GROUP_MEMORY on, filed in group_log; /quiet is registered only while this is not off. "off" or unset: the route answers 404 and nothing is read or written; see docs/runbooks/listener.md.
LISTENER_UNTAGGED = "off" # "on" (only with LISTENER dry or live; ASK_RESEARCH on; never in a PR preview) lets the listener treat untagged channel text from roster members (worker/listener-untagged.js): rules first, a Haiku-class paid-Claude call only for question-shaped candidates, an answer only when a direct checkable answer exists, the confidence threshold passes and the channel's soft daily cap is not spent (dry: the classifier is still called for candidates and the would-be decision is kept in listen_events, with no text there and no answer posted; every text that is not answered is filed in group_log when GROUP_MEMORY is on, personal topics included, in dry and live alike); personal topics are only never answered unprompted. Needs the Discord Message Content intent to see any text, which stays off in the portal until the owner decides. "off" or unset: untagged text is handled exactly as before; see docs/runbooks/listener.md.
SHADOW_ASK = "on" # "on" opens POST /api/shadow/ask (worker/shadow-ask.js): a signed (HMAC, its own derived key leeroy-shadow-v1) call that runs one mirrored question through the real /ask research compose path and records the answer in the private D1 table shadow_answers; it posts nothing anywhere. Needs ASK_RESEARCH on and the bot token; never in a PR preview. Its Claude spend counts under the monthly cap and its own sub-cap of 2% of it. "off" or unset: the route answers 404 and nothing is read or written; see docs/runbooks/shadow-ask.md.
# Shadow route limits (worker/shadow-ask.js shadowLimits; docs/runbooks/shadow-ask.md). Plain positive numbers as strings; unset, empty, non-numeric, zero or negative falls back to the default shown (never to unlimited), a value past the range is clamped to its edge.
# A truth-graded baseline needs 60 to 200 composes: raising these is a separate change to these values. The monthly RESEARCH_CLAUDE_MONTHLY_TOKENS cap still binds whatever is set here.
SHADOW_ASK_HOURLY = "60" # accepted shadow calls per rolling hour (integer, 1 to 120)
SHADOW_ASK_DAILY = "100" # accepted shadow calls per rolling day (integer, 1 to 600; never below SHADOW_ASK_HOURLY)
SHADOW_ASK_SUBCAP_PERCENT = "5" # the shadow's own share of RESEARCH_CLAUDE_MONTHLY_TOKENS, in percent (0.1 to 20; 2 = 100,000 tokens at the 5,000,000 cap)
CARDS_ENABLED = "off" # sign-up cards, buttons, modals and card edits (docs/runbooks/cards.md); "1", "true", "on" or "yes" turns it on
CARDS_SHADOW = "off" # with CARDS_ENABLED: count would-edit / would-post rows in noise_ledger, never call Discord
BOARD_LINES_ENABLED = "off" # needs CARDS_ENABLED too: the first real board decision line
SETUP_COMMAND = "off" # "on" lists and answers the Discord /setup command (worker/setup-command.js)
EVAL_ENABLED = "off" # "on" (or "true", "1") opens the admin model bake-off route (docs/runbooks/model-bake-off.md); it is 404 while off
DEADMAN = "off" # "on" opens the dead-man check (worker/deadman.js, docs/runbooks/deadman.md): POST /api/heartbeat and POST /api/heartbeat/status (signed with keys derived from the bot token, one per source plus a read-only status key; never in a PR preview) and one more step in the every-minute cron that opens a row in the D1 table incidents when an expected PC-side source has been silent for DEADMAN_STALE_SECONDS. It sends nothing anywhere: alerting is not built. "off" or unset: both routes answer 404, the cron step does nothing and nothing is read or written.
DEADMAN_STALE_SECONDS = "300" # seconds of silence before an incident opens; clamped to 120..3600 (unset or not a number: 300). Only read while DEADMAN is on.
DEADMAN_EXPECT = "" # comma list of sources ("pc-bot", "pc-session") expected even before their first heartbeat; empty: a source is expected only after it has sent one. Only read while DEADMAN is on.
GAME_FACTS_LOAD = "off" # "on" opens POST /api/facts/load (worker/game-facts.js, docs/runbooks/game-facts.md): a signed (HMAC, its own derived key leeroy-facts-load-v1; never in a PR preview) loader that fills the D1 tables game_fact_loads and game_facts with game data from the PC. Nothing reads those rows yet; "off" or unset: the route answers 404 and nothing is read or written.
# Read by the Worker but deliberately NOT declared here: ANSWER_FORMAT (defaults ON when unset; set "off" to turn it off), AI_DAILY_NEURON_CAP and ASK_DEADLINE_MS (optional numbers, the code has defaults),
# CLOUDFLARE_ACCOUNT_ID alternates ACCOUNT_ID / CF_ACCOUNT_ID, the preview-only names (set by the preview deploy, which looks for one of them in this file, so do not write it here), and the secrets and bindings listed in tests/unit/wrangler-flags.test.mjs.
INTEREST_NUDGES = "off" # Flagship flag (worker/interest.js, q-20261114-24): "on" adds the ask and interest-count buttons to /tonight and /signup and lets the 6-hour cron read Interested and reaction counts on Leeroy's own events and posts (GET only, counts only, never a sign-up)
REQUEST_GAUGE = "off" # "on" counts this Worker's requests per UTC day (in memory, flushed to D1 table request_gauge about every 25 requests) and enables GET /api/admin/requests (404 while off); needs migration 0008. An approximation: the Cloudflare dashboard stays the source of truth (docs/runbooks/cloudflare-requests.md)
