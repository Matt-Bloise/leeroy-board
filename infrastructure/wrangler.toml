name = "leeroy-brain"
main = "worker/index.js"
compatibility_date = "2025-02-01"
workers_dev = true

# Custom Domain binding on Cloudflare Free Tier
# Automatically provisions edge SSL and routes https://api.leeroy.party to this Worker
routes = [
  { pattern = "api.leeroy.party", custom_domain = true }
]

# 6-Hour autonomous source sweep (Blizzard news, Wowhead, Raidplan, Wiki)
# 4 runs/day keeps background AI fact extraction strictly under the 10,000 Workers AI neuron/day free limit.
# Live on-demand refreshes remain available via UI and /intent { kind: "refresh" }.
# Plus "* * * * *": the timed Discord posts (worker/moments.js). It does nothing unless MOMENTS_ENABLED is on, and it reads no
# D1 rows while off. Workers Free allows 5 cron triggers per account, so this is the second of five.
[triggers]
crons = ["0 */6 * * *", "* * * * *"]

# Cloudflare D1 Serverless SQLite Database (Free Tier: 5 GB storage, 5M reads/day, 100k writes/day)
# Workers Logs (free plan: 200,000 events a day, 3 days retention). Added so answer failures, provider fallbacks and delivery times are visible; console.log lines are captured as custom logs.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "leeroy-board-db"
database_id = "00000000-0000-0000-0000-000000000000" # Replaced automatically in CI or via `wrangler d1 create`
migrations_dir = "migrations"

# Hibernatable WebSocket Durable Object (Free Tier: SQLite-backed, 100k req/day)
[durable_objects]
bindings = [
  { name = "BOARD_ROOM", class_name = "BoardRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]

# Native Cloudflare Workers AI Binding (Free Tier: 10,000 Neurons/day, Zero external API key needed)
[ai]
binding = "AI"

[vars]
# Default AI provider ("claude", "gemini", "workers-ai", "groq", "cerebras", "github", or "openrouter")
# Can also be switched per-question in the UI or Discord `/ask` command.
AI_PROVIDER = "claude"
AI_GATEWAY_ID = "leeroy-ai-gateway"
AI_GATEWAY_CACHE_TTL = "21600" # 6 hours: aligned with the 6-hour cron sweep ("0 */6 * * *")
CLOUDFLARE_ACCOUNT_ID = ""
CLAUDE_MODEL_FAST = "claude-haiku-4-5-20251001"
CLAUDE_MODEL_DEEP = "claude-sonnet-4-5-20250929"
GEMINI_MODEL_FAST = "gemini-3.5-flash-lite"
GEMINI_MODEL_DEEP = "gemini-3.8-pro"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GROQ_MODEL_FAST = "llama-3.3-70b-versatile"
GROQ_MODEL_DEEP = "llama-3.3-70b-versatile"
CEREBRAS_MODEL = "llama-3.3-70b"
GITHUB_MODEL_FAST = "gpt-4o-mini"
GITHUB_MODEL_DEEP = "gpt-4o"
OPENROUTER_MODEL = "deepseek/deepseek-chat-v3-0324:free"
API_ORIGIN = "https://api.leeroy.party"
BOARD_PUBLIC_URL = "https://leeroy.party"
WEB_LOGIN = "off" # Q18 web Discord login: "on" enables /api/auth/discord/start, /callback, /api/auth/logout and cookie sessions on GET /api/me
DATA_RIGHTS = "off" # Q59 member data export and erase: "on" enables GET /api/me/export and POST /api/me/erase (404 while off)
EVENTS_ENABLED = "off" # Discord scheduled events: "on" enables POST /api/admin/events/sync (404 while off); see docs/runbooks/scheduled-events.md
MOMENTS_ENABLED = "off" # timed Discord posts (docs/runbooks/moments.md): "on" lets the every-minute cron post. The PC bot stays authoritative for launch night (Nov 3 to 4): leave off until after launch.
MOMENTS_SHADOW = "off" # shadow mode: plans and writes would_post / would_edit rows to the D1 ledger, never calls Discord. Exclusive with MOMENTS_ENABLED (both on = nothing runs).
MOMENTS_DRY_RUN = "off" # "on" logs what would be posted and posts nothing (works with MOMENTS_ENABLED off)
ALLOWED_ORIGINS = "https://matt-bloise.github.io,https://leeroy-board.pages.dev,https://leeroy.party,https://www.leeroy.party,https://api.leeroy.party,https://1561857940174938114.discordsays.com"
